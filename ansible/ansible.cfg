[defaults]
inventory = inventory/hosts.yaml
roles_path = roles
host_key_checking = False

# No cowsay output, even when cowsay is installed
nocows = True

# Silence the "discovered Python interpreter" warning
interpreter_python = auto_silent

# Readable multi-line output (stdout, psql results) instead of JSON blobs
callback_result_format = yaml

# Per-task timing summary at the end, to find the slow parts
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# Runs each module over the existing SSH session instead of copying a temp
# file per task. Safe here: Ansible connects as root, no become/requiretty.
pipelining = True
