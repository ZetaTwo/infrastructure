---
- name: Configure cluster node
  hosts: all
  become: false
  environment:
    # Lets kubernetes.core modules skip repeating kubeconfig: per task.
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  roles:
    - users
    - sshd
    - k3s
    - flux
    - ghcr_pull_secret
    - aoe2_groups_proxy
    - aoe2_tournament_bot
    - oauth2_proxy
    - monitoring
