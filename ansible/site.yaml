---
- name: Configure cluster node
  hosts: all
  become: false
  environment:
    # Read by the kubernetes.core collection's modules (K8S_AUTH_KUBECONFIG)
    # so every k8s task talks to the local k3s API without repeating
    # kubeconfig: on each one. Only exists once the k3s role has run.
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  roles:
    - users
    - sshd
    - k3s
    - flux
    - ghcr_pull_secret
    - aoe2_groups_proxy
