---
# Per-environment loop for ansible/roles/aoe2_groups: each entry gets its
# own namespace + Secret from files/<name>/. Staging deliberately reuses
# production's GCP service account and Sheet (docs/app-setup.md).
aoe2_groups_environments:
  - name: production
    namespace: aoe2-groups
  - name: staging
    namespace: aoe2-groups-staging
