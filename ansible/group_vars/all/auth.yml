# Per-app auth policies: each becomes Middleware
# auth-oauth2-proxy-<name>@kubernetescrd (ansible/roles/oauth2_proxy),
# allowing only the listed Google account emails (comma-separated). Email
# lists are vaulted — this repo is public:
#   ansible-vault encrypt_string 'a@example.com,b@example.com' --name oauth2_proxy_admin_emails --vault-password-file .vault_pass
oauth2_proxy_policies:
  admin: "{{ oauth2_proxy_admin_emails }}"
  collaborators: "{{ oauth2_proxy_admin_emails }},{{ oauth2_proxy_collaborator_emails }}"
