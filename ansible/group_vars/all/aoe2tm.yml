---
# ansible/roles/aoe2tm: same shape as canst_environments (two Secrets per
# environment, aoe2tm-config and aoe2tm-config-migrate). The integrations are
# optional: each one, once added (vaulted values, then make ansible-apply),
# turns that feature on in the app. Redirect URIs to register with the
# providers are https://<domain>/api/auth/{discord,xbox}/callback.
#   discord:       {client_id: ..., client_secret: ...}
#   xbox:          {client_id: ..., client_secret: ...}   (Microsoft Entra app)
#   steam:         {} or {api_key: ...}                     (no app registration)
#   challonge:     {api_key: ...}
#   google_sheets: {api_key: ...}
#   smtp:          {host: ..., port: 587, username: ..., password: ..., from: ...}
#   s3:            {bucket: ..., region: ..., endpoint: ..., access_key_id: ..., secret_access_key: ...}
aoe2tm_environments:
  - name: staging
    namespace: aoe2tm-staging
    domain: aoe2tm.zetatwo.dev
    seed: true
    db_name: aoe2tm_staging
    app_db_password: "{{ aoe2tm_staging_app_db_password }}"
    migrate_db_password: "{{ aoe2tm_staging_migrate_db_password }}"
    paseto_key: "{{ aoe2tm_staging_paseto_key }}"

