---
# ansible/roles/aoe2tm: same shape as canst_environments (two Secrets per
# environment, aoe2tm-config and aoe2tm-config-migrate). The integrations are
# optional: each one, once added (vaulted values, then make ansible-apply),
# turns that feature on in the app. Redirect URIs to register with the
# providers are https://<domain>/api/auth/{discord,xbox}/callback.
#   discord:       {client_id: ..., client_secret: ...}
#   xbox:          {client_id: ..., client_secret: ...}   (Microsoft Entra app)
#   steam:         {} or {api_key: ...}                     (no app registration)
#   challonge:     {api_key: ...}
#   google_sheets: {api_key: ...}
#   smtp:          {host: ..., port: 587, username: ..., password: ..., from: ...}
#   s3:            {bucket: ..., region: ..., endpoint: ..., access_key_id: ..., secret_access_key: ...}
aoe2tm_environments:
  - name: staging
    namespace: aoe2tm-staging
    domain: gatherpoint.zetatwo.dev
    seed: true
    db_name: aoe2tm_staging
    app_db_password: "{{ aoe2tm_staging_app_db_password }}"
    migrate_db_password: "{{ aoe2tm_staging_migrate_db_password }}"
    paseto_key: "{{ aoe2tm_staging_paseto_key }}"
    # The aoe2tm-staging Postmark server; its token is both username and password.
    smtp:
      host: smtp.postmarkapp.com
      port: 587
      username: "{{ aoe2tm_staging_postmark_token }}"
      password: "{{ aoe2tm_staging_postmark_token }}"
      from: "Gather Point <gatherpoint@zetatwo.dev>"
    # The "Gather Point (dev)" apps, shared with local dev; each has this
    # domain's callback registered as a second redirect URI.
    discord:
      client_id: "1573037965310042113"
      client_secret: "{{ aoe2tm_staging_discord_client_secret }}"
    xbox:
      client_id: "83a091e3-f5be-4f99-9384-8d0dd59fa74f"
      client_secret: "{{ aoe2tm_staging_xbox_client_secret }}"
    # Steam login needs no app registration; the Web API key (registered to
    # zeta-two.com, which Steam doesn't enforce) adds persona names.
    steam:
      api_key: "{{ aoe2tm_staging_steam_api_key }}"
  # Prepared, not live yet: k8s/aoe2tm/overlays/production isn't in
  # k8s/kustomization.yaml and setgatherpoint.com has no web record, so
  # applying this only creates the namespace, its Secrets and the database.
  - name: production
    namespace: aoe2tm-production
    domain: setgatherpoint.com
    db_name: aoe2tm_production
    app_db_password: "{{ aoe2tm_production_app_db_password }}"
    migrate_db_password: "{{ aoe2tm_production_migrate_db_password }}"
    paseto_key: "{{ aoe2tm_production_paseto_key }}"
    # The aoe2tm-production Postmark server, sending from setgatherpoint.com
    # (DKIM and Return-Path in terraform/dns.tf).
    smtp:
      host: smtp.postmarkapp.com
      port: 587
      username: "{{ aoe2tm_production_postmark_token }}"
      password: "{{ aoe2tm_production_postmark_token }}"
      from: "Gather Point <noreply@setgatherpoint.com>"
    # The production "Gather Point" apps; each has only
    # https://setgatherpoint.com/api/auth/<provider>/callback registered.
    discord:
      client_id: "1574434581044658338"
      client_secret: "{{ aoe2tm_production_discord_client_secret }}"
    xbox:
      client_id: "7510475e-5ae8-4e10-845c-2025a311aae3"
      client_secret: "{{ aoe2tm_production_xbox_client_secret }}"
    # The same Web API key as staging: Steam allows one per account and
    # doesn't enforce its registered domain.
    steam:
      api_key: "{{ aoe2tm_staging_steam_api_key }}"

