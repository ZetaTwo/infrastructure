---
# domains: label -> domain name, generated by Terraform into
# ansible/inventory/hosts.yaml (gitignored) — see terraform/data.tf.

# Pinned deliberately — bumping triggers an upgrade on the next
# `make ansible-apply` (ansible/roles/k3s). Releases:
#   https://github.com/k3s-io/k3s/releases
#   https://github.com/cert-manager/cert-manager/releases
k3s_version: v1.36.4+k3s1
cert_manager_version: v1.19.5

# Let's Encrypt expiry notices for the ClusterIssuer (ansible/roles/k3s).
# Not a secret.
letsencrypt_email: "calle.svensson@zeta-two.com"

# Pinned, same as k3s_version above. Releases:
# https://github.com/fluxcd/flux2/releases
flux_version: v2.9.5

# Flux and per-app secrets are vault-encrypted FILES, not vars here:
#   ansible/roles/flux/files/flux-infrastructure-deploy-key             (encrypted)
#   ansible/roles/flux/files/flux-infrastructure-deploy-key.pub         (plain)
#   ansible/roles/aoe2_groups_proxy/files/{production,staging}/{service-account.json,sheet-ids.toml} (encrypted)
#   ansible/roles/aoe2_tournament_bot/files/{config.toml,service-account.json} (encrypted)
# Bootstrap steps: docs/app-setup.md, docs/cluster-setup.md.
# GitHub's SSH host keys are fetched live from https://api.github.com/meta
# by ansible/roles/flux — no bootstrap needed for those.

# GitHub account owning the ghcr.io packages pulled via ghcr-pull-secret.
# Not secret — ghcr_pull_token below is.
ghcr_pull_username: "ZetaTwo"

# Namespaces needing a copy of ghcr-pull-secret (Secrets can't cross
# namespaces). Add a namespace here when a new app needs private pulls.
ghcr_pull_secret_namespaces:
  - aoe2-groups-proxy
  - aoe2-groups-proxy-staging
  - aoe2-tournament-bot
  - aoe2tm-staging
  - canst-staging

# GitHub PAT, read:packages scope (classic — GHCR doesn't support
# fine-grained tokens for pulls).
#   ansible-vault encrypt_string '<the token>' --name ghcr_pull_token --vault-password-file .vault_pass
ghcr_pull_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          39383839353765316130303830336237646330353363373030333162393431393830316232366636
