# ansible/roles/backups loops over this — one Secret per entry, in the
# app's own namespace, with the shared S3 creds above plus its own
# restic_password (see docs/backups.md's "Adding backups for a new
# stateful app"). A `postgres:` entry is for a database on the shared
# Postgres: the Secret then also carries PGHOST/PGUSER/PGDATABASE/PGPASSWORD.
# `user` is the read-only role pg_dump connects as (ansible/roles/postgres) —
# distinct from the app's own runtime role.
backup_targets:
  - name: canst-staging
    namespace: canst-staging
    restic_password: "{{ canst_staging_restic_password }}"
    postgres:
      database: canst_staging
      user: canst_staging_backup
      password: "{{ canst_staging_backup_db_password }}"
  - name: aoe2tm-staging
    namespace: aoe2tm-staging
    restic_password: "{{ aoe2tm_staging_restic_password }}"
    postgres:
      database: aoe2tm_staging
      user: aoe2tm_staging_backup
      password: "{{ aoe2tm_staging_backup_db_password }}"
