---
# Shared S3 credentials for the backups bucket (docs/backups.md,
# docs/cluster-setup.md). backups_s3_endpoint/bucket aren't secret; the
# access/secret key are.
backups_s3_endpoint: "https://fsn1.your-objectstorage.com"
backups_s3_bucket: "zetatwo-infra-backups"
#   ansible-vault encrypt_string '<access key>' --name backups_s3_access_key --vault-password-file .vault_pass
#   ansible-vault encrypt_string '<secret key>' --name backups_s3_secret_key --vault-password-file .vault_pass

backups_s3_access_key: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          64313234336633393134343732666163373134316365323533623635653637343365306335656662
          3264346336353462633466353462353932363637363362610a613764353539636266363035663732
          36646161343864306131376334386233363936663631616633383439363066303665393636373733
          3836336233633732320a353464633761336231353238303437383563366466633638313635623164
          34366166316534643763316539366566393532306136623537666334396563633532

backups_s3_secret_key: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          66303135333235616130393930366332653033616430316463363939323938653835356132663662
          3630316134643363643136663765643838393331373439350a653666646532663737313731616631
