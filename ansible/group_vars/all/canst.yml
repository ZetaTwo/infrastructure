---
# ansible/roles/canst: one namespace + two Secrets (canst-config for the main
# container's config.toml, canst-config-migrate for the migrate initContainer's
# migrate.toml) per environment — kept separate so the running app container
# never has the migrate role's credential sitting on its filesystem. paseto_key
# is `openssl rand -base64 32`, vaulted like postgres.yml's passwords. `seed: true` lets the
# app's seed command run (staging only; its overlay adds the initContainer).
# Optional `postmark_token` (the canst-<env> Postmark server's API token,
# vaulted as canst_<env>_postmark_token) turns on [smtp] for password reset
# emails; without it they're only logged (docs/messaging.md).
canst_environments:
  - name: staging
    namespace: canst-staging
    domain: canst.zetatwo.dev
    seed: true
    db_name: canst_staging
    app_db_password: "{{ canst_staging_app_db_password }}"
    migrate_db_password: "{{ canst_staging_migrate_db_password }}"
    paseto_key: "{{ canst_staging_paseto_key }}"
    postmark_token: "{{ canst_staging_postmark_token }}"

canst_staging_migrate_db_password: !vault |
