---
# ansible/roles/notify: where apps' operational messages go, by tag
# (docs/messaging.md). Each target is an Apprise URL. A Discord webhook URL
# works as-is; email is a mailtos:// URL through Postmark's notify server,
# sending as notify@zetatwo.dev:
#   mailtos://<token>:<token>@zetatwo.dev:587?smtp=smtp.postmarkapp.com&from=notify@zetatwo.dev&name=Infra&to=<you>
# Notices go to their own Discord channel; reports to #reports and email.
# Each URL is vaulted:
#   ansible-vault encrypt_string '<url>' --name notify_<x>_url --vault-password-file .vault_pass
notify_targets:
  - url: "{{ notify_discord_notifications_webhook_url }}"
    tags: [notice]
  - url: "{{ notify_discord_reports_webhook_url }}"
    tags: [report]
  - url: "{{ notify_email_url }}"
    tags: [report]

