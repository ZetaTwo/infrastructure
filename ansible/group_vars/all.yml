# GitHub account owning the ghcr.io packages pulled via ghcr-pull-secret.
# Not secret — ghcr_pull_token below is.
ghcr_pull_username: "ZetaTwo"

# Namespaces needing a copy of ghcr-pull-secret (Secrets can't cross
# namespaces). Add a namespace here when a new app needs private pulls.
ghcr_pull_secret_namespaces:
  - aoe2-groups-proxy
  - aoe2-groups-proxy-staging
  - aoe2-tournament-bot

# GitHub PAT, read:packages scope (classic — GHCR doesn't support
