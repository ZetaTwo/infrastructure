---
# domains is a map of label -> real domain name, supplied by Terraform via
# ansible/inventory/hosts.yaml (generated, gitignored) — see
# terraform/variables.tf's cloudflare_zones and terraform/data.tf. Any label
# added to cloudflare_zones in tfvars becomes available here automatically,
# e.g. domains.zetatwo_com, domains.zetatwo_dev.

# k3s_version / cert_manager_version are pinned deliberately — bumping them
# here is what triggers an upgrade on the next `make ansible-apply` (see
# ansible/roles/k3s). Verify current releases at:
#   https://github.com/k3s-io/k3s/releases
#   https://github.com/cert-manager/cert-manager/releases
k3s_version: v1.36.4+k3s1
cert_manager_version: v1.19.5

# letsencrypt_email receives Let's Encrypt expiry/account notices for
# certificates issued via the ClusterIssuer (ansible/roles/k3s). Not a
# secret — override here if you want a different address.
letsencrypt_email: "calle.svensson@zeta-two.com"

# flux_version is pinned deliberately, same convention as k3s_version above
# — bumping it triggers an upgrade on the next `make ansible-apply` (see
# ansible/roles/flux). Verify current releases at:
#   https://github.com/fluxcd/flux2/releases
flux_version: v2.9.5

# Flux's git auth (the read-only GitHub Deploy Key) and the per-app secrets
# (SA key JSONs, sheet-ids.toml, config.toml) are NOT stored as vars here —
# they're ansible-vault-encrypted files instead:
#   ansible/roles/flux/files/flux-infrastructure-deploy-key       (encrypted)
#   ansible/roles/flux/files/flux-infrastructure-deploy-key.pub   (plain — not a secret)
#   ansible/roles/aoe2_groups_proxy/files/service-account.json    (encrypted)
#   ansible/roles/aoe2_groups_proxy/files/sheet-ids.toml           (encrypted)
#   ansible/roles/aoe2_tournament_bot/files/config.toml            (encrypted)
#   ansible/roles/aoe2_tournament_bot/files/service-account.json   (encrypted)
# See README.md for the full bootstrap steps (ansible-vault encrypt <file>).
# GitHub's SSH host keys are fetched live from https://api.github.com/meta
# by ansible/roles/flux — nothing to store for those either.

# ghcr_pull_username is the GitHub account that owns/has read access to the
# private ghcr.io packages pulled via ghcr-pull-secret. Not a secret — the
# paired PAT (ghcr_pull_token, below) is what's sensitive.
ghcr_pull_username: "ZetaTwo"

# ghcr_pull_secret_namespaces lists every namespace that needs a copy of
# ghcr-pull-secret — k8s Secrets can't be referenced across namespaces, so
# each app namespace pulling a private ghcr.io image needs its own copy of
# the same underlying token. Add a namespace here when a new app needs it;
# no other Ansible changes required.
ghcr_pull_secret_namespaces:
  - aoe2-groups-proxy
  - aoe2-tournament-bot

# ghcr_pull_token is a GitHub PAT with read-only package access
# (fine-grained: "Packages: Read-only"; classic: read:packages scope),
# belonging to an account with access to the private ghcr.io packages —
# vaulted, via:
#   ansible-vault encrypt_string '<the token>' \
#     --name ghcr_pull_token --vault-password-file .vault_pass
# and appending the resulting block to this file.
ghcr_pull_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          39383839353765316130303830336237646330353363373030333162393431393830316232366636
          3834383933356638376163316232343361396561346462660a366664653830383133336464313839
          65363563343236386635613362313336316433616364343231343735373235356266633864383464
          3464623763353634390a363961613061326432356630643734313233363239643331336439393063
          34643862353133623066386234356633323132643332653033386131353166306339353663663335
          3738373366643761663733336437616334616330623663376437

# zetatwo_password_hash is a pre-hashed (crypt/shadow-style, e.g. yescrypt)
# password for the zetatwo admin user — see README.md — via:
#   mkpasswd --method=yescrypt
#   ansible-vault encrypt_string --name zetatwo_password_hash --vault-password-file .vault_pass
# and appending the resulting block to this file.
zetatwo_password_hash: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          63623338316531346132383665666563393636313235313634633136363734663763636161336239
          3238323038396664356132383965656665316130366534320a303236636230353566633539633836
          39666662396161333233326264326131353863316634666237346330323961616132343038373838
          6365333330363762390a396461356330373437356536336233303962353733376631663266303337
          36636166313931386265313631626564656265393531623532333134316636343434306263663234
          65646337666131343234643331383165613336353336313438393461636366663064323039666462
          32393732653033313030623964333062316533396234326639303538353130643331343138626631
          62633231303838356431
