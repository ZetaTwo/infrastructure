#   ansible/roles/flux/files/flux-infrastructure-deploy-key             (encrypted)
#   ansible/roles/flux/files/flux-infrastructure-deploy-key.pub         (plain)
#   ansible/roles/aoe2_groups_proxy/files/{production,staging}/{service-account.json,sheet-ids.toml} (encrypted)
#   ansible/roles/aoe2_tournament_bot/files/{config.toml,service-account.json} (encrypted)
# Bootstrap steps: docs/app-setup.md, docs/cluster-setup.md.
# GitHub's SSH host keys are fetched live from https://api.github.com/meta
# by ansible/roles/flux — no bootstrap needed for those.

# Per-environment loop for ansible/roles/aoe2_groups_proxy: each entry gets
# its own namespace + Secret from files/<name>/. Staging deliberately
# reuses production's GCP service account and Sheet (docs/app-setup.md).
aoe2_groups_proxy_environments:
  - name: production
    namespace: aoe2-groups-proxy
  - name: staging
    namespace: aoe2-groups-proxy-staging

