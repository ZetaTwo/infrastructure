---
# domains is a map of label -> real domain name, supplied by Terraform via
# ansible/inventory/hosts.yaml (generated, gitignored) — see
# terraform/variables.tf's cloudflare_zones and terraform/data.tf. Any label
# added to cloudflare_zones in tfvars becomes available here automatically,
# e.g. domains.zetatwo_com, domains.zetatwo_dev.

# k3s_version / cert_manager_version are pinned deliberately — bumping them
# here is what triggers an upgrade on the next `make ansible-apply` (see
# ansible/roles/k3s). Verify current releases at:
#   https://github.com/k3s-io/k3s/releases
#   https://github.com/cert-manager/cert-manager/releases
k3s_version: v1.36.4+k3s1
cert_manager_version: v1.19.5

# letsencrypt_email receives Let's Encrypt expiry/account notices for
# certificates issued via the ClusterIssuer (ansible/roles/k3s). Not a
# secret — override here if you want a different address.
letsencrypt_email: "calle.svensson@zeta-two.com"

# flux_version is pinned deliberately, same convention as k3s_version above
# — bumping it triggers an upgrade on the next `make ansible-apply` (see
# ansible/roles/flux). Verify current releases at:
#   https://github.com/fluxcd/flux2/releases
flux_version: v2.9.5

