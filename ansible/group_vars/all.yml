# Per-app auth policies: each becomes Middleware
# auth-oauth2-proxy-<name>@kubernetescrd (ansible/roles/oauth2_proxy),
# allowing only the listed Google account emails (comma-separated). Email
# lists are vaulted — this repo is public:
#   ansible-vault encrypt_string 'a@example.com,b@example.com' --name oauth2_proxy_admin_emails --vault-password-file .vault_pass
oauth2_proxy_policies:
  admin: "{{ oauth2_proxy_admin_emails }}"
  collaborators: "{{ oauth2_proxy_admin_emails }},{{ oauth2_proxy_collaborator_emails }}"

# GitHub account owning the ghcr.io packages pulled via ghcr-pull-secret.
# Not secret — ghcr_pull_token below is.
ghcr_pull_username: "ZetaTwo"

# Namespaces needing a copy of ghcr-pull-secret (Secrets can't cross
# namespaces). Add a namespace here when a new app needs private pulls.
ghcr_pull_secret_namespaces:
  - aoe2-groups-proxy
  - aoe2-groups-proxy-staging
  - aoe2-tournament-bot

# GitHub PAT, read:packages scope (classic — GHCR doesn't support
# fine-grained tokens for pulls).
#   ansible-vault encrypt_string '<the token>' --name ghcr_pull_token --vault-password-file .vault_pass
