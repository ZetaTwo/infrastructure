# Flux's git auth (the read-only GitHub Deploy Key) and the per-app secrets
# (SA key JSONs, sheet-ids.toml, config.toml) are NOT stored as vars here —
# they're ansible-vault-encrypted files instead:
#   ansible/roles/flux/files/flux-infrastructure-deploy-key              (encrypted)
#   ansible/roles/flux/files/flux-infrastructure-deploy-key.pub          (plain — not a secret)
#   ansible/roles/aoe2_groups_proxy/files/production/service-account.json (encrypted)
#   ansible/roles/aoe2_groups_proxy/files/production/sheet-ids.toml       (encrypted)
#   ansible/roles/aoe2_groups_proxy/files/staging/service-account.json    (encrypted)
#   ansible/roles/aoe2_groups_proxy/files/staging/sheet-ids.toml          (encrypted)
#   ansible/roles/aoe2_tournament_bot/files/config.toml            (encrypted)
#   ansible/roles/aoe2_tournament_bot/files/service-account.json   (encrypted)
# See docs/app-setup.md and docs/cluster-setup.md for the full bootstrap
# steps (ansible-vault encrypt <file>).
# GitHub's SSH host keys are fetched live from https://api.github.com/meta
# by ansible/roles/flux — nothing to store for those either.

# aoe2_groups_proxy_environments drives ansible/roles/aoe2_groups_proxy's
# per-environment loop — each entry gets its own namespace and its own
# Secret, populated from the role's files/<name>/service-account.json and
# files/<name>/sheet-ids.toml. The split supports fully separate
# credentials per environment; for aoe2-groups-proxy specifically, staging
# deliberately reuses production's GCP service account and Google Sheet
# (see docs/app-setup.md's "aoe2-groups-proxy staging secrets bootstrap" for why).
aoe2_groups_proxy_environments:
  - name: production
    namespace: aoe2-groups-proxy
  - name: staging
    namespace: aoe2-groups-proxy-staging

# oauth2_proxy_client_id / oauth2_proxy_client_secret come from a GitHub
# OAuth App (GitHub -> Settings -> Developer settings -> OAuth Apps),
# homepage https://auth.zetatwo.dev, callback
# https://auth.zetatwo.dev/oauth2/callback — see ansible/roles/oauth2_proxy
# and docs/app-setup.md's "Auth (GitHub OAuth via oauth2-proxy)" section.
# oauth2_proxy_cookie_secret is 32 random bytes, generated locally via:
#   python3 -c "import secrets, base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())"
# The client ID isn't actually sensitive (it's visible in the OAuth redirect
# URL anyway) but is vaulted alongside the other two for consistency, since
# all three make up one logical credential set. Add via:
#   ansible-vault encrypt_string '<value>' --name oauth2_proxy_client_id --vault-password-file .vault_pass
#   ansible-vault encrypt_string '<value>' --name oauth2_proxy_client_secret --vault-password-file .vault_pass
#   ansible-vault encrypt_string '<value>' --name oauth2_proxy_cookie_secret --vault-password-file .vault_pass
# and append the resulting blocks here.
oauth2_proxy_client_id: !vault |
          $ANSIBLE_VAULT;1.1;AES256
