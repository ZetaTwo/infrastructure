# ansible/roles/backups loops over this — one Secret per entry, in the
# app's own namespace, with the shared S3 creds above plus its own
# restic_password (see docs/backups.md's "Adding backups for a new
# stateful app"). A `postgres:` entry is for a database on the shared
# Postgres: the Secret then also carries PGHOST/PGUSER/PGDATABASE/PGPASSWORD.
backup_targets:
  - name: canst-staging
    namespace: canst-staging
    restic_password: "{{ canst_staging_restic_password }}"
    postgres:
      database: canst_staging
      password: "{{ canst_staging_db_password }}"

# Shared Postgres (k8s/postgres/, ansible/roles/postgres — docs/app-setup.md
# #shared-postgres). Each postgres_databases entry gets a role and a database
# of the same name, owned by that role. Passwords are 32 random bytes:
#   python3 -c "import secrets, base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())" \
#     | ansible-vault encrypt_string --stdin-name <name> --vault-password-file .vault_pass
postgres_databases:
  - name: canst_staging
    password: "{{ canst_staging_db_password }}"

# ansible/roles/canst: one namespace + canst-config Secret (config.toml) per
# environment. paseto_key is `openssl rand -base64 32`, vaulted like above.
canst_environments:
  - name: staging
    namespace: canst-staging
    domain: canst.zetatwo.dev
    db_name: canst_staging
    db_password: "{{ canst_staging_db_password }}"
    paseto_key: "{{ canst_staging_paseto_key }}"

