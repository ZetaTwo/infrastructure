# ghcr_pull_username is the GitHub account that owns/has read access to the
# private ghcr.io packages pulled via ghcr-pull-secret. Not a secret — the
# paired PAT (ghcr_pull_token, below) is what's sensitive.
ghcr_pull_username: "ZetaTwo"

# ghcr_pull_secret_namespaces lists every namespace that needs a copy of
# ghcr-pull-secret — k8s Secrets can't be referenced across namespaces, so
# each app namespace pulling a private ghcr.io image needs its own copy of
# the same underlying token. Add a namespace here when a new app needs it;
# no other Ansible changes required.
ghcr_pull_secret_namespaces:
  - aoe2-groups-proxy
  - aoe2-groups-proxy-staging
  - aoe2-tournament-bot

# ghcr_pull_token is a GitHub PAT with read-only package access
# (fine-grained: "Packages: Read-only"; classic: read:packages scope),
# belonging to an account with access to the private ghcr.io packages —
# vaulted, via:
#   ansible-vault encrypt_string '<the token>' \
#     --name ghcr_pull_token --vault-password-file .vault_pass
# and appending the resulting block to this file.
ghcr_pull_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          39383839353765316130303830336237646330353363373030333162393431393830316232366636
