---
- name: Check installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current
  changed_when: false
  failed_when: false

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: '0755'

- name: Install/upgrade k3s to {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_current.rc != 0 or k3s_version not in k3s_current.stdout

- name: Ensure k3s service is enabled and started
  ansible.builtin.systemd:
    name: k3s
    daemon_reload: true
    enabled: true
    state: started

- name: Wait for node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=120s
  changed_when: false

- name: Check whether cert-manager {{ cert_manager_version }} is already installed
  ansible.builtin.stat:
    path: "/etc/rancher/k3s/.cert-manager-{{ cert_manager_version }}-installed"
  register: cert_manager_marker

- name: Install cert-manager {{ cert_manager_version }}
  ansible.builtin.command: >-
    k3s kubectl apply -f
    https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml
  when: not cert_manager_marker.stat.exists

- name: Wait for cert-manager deployments to be available
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=Available
    deployment/cert-manager deployment/cert-manager-webhook deployment/cert-manager-cainjector
    -n cert-manager --timeout=180s
  when: not cert_manager_marker.stat.exists
  changed_when: false

- name: Mark cert-manager as installed
  ansible.builtin.file:
    path: "/etc/rancher/k3s/.cert-manager-{{ cert_manager_version }}-installed"
    state: touch
    mode: '0644'
  when: not cert_manager_marker.stat.exists

- name: Deploy Let's Encrypt ClusterIssuer
  ansible.builtin.template:
    src: cluster-issuer.yaml.j2
    dest: /etc/rancher/k3s/cluster-issuer.yaml
    mode: '0644'
  register: cluster_issuer

- name: Apply ClusterIssuer
  ansible.builtin.command: k3s kubectl apply -f /etc/rancher/k3s/cluster-issuer.yaml
  when: cluster_issuer.changed
