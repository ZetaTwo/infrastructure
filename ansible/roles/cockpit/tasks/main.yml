---
- name: Install cockpit
  ansible.builtin.apt:
    name: cockpit
    state: present
    update_cache: true

- name: Create cockpit.socket drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/cockpit.socket.d
    state: directory
    mode: '0755'

- name: Restrict cockpit socket to localhost
  ansible.builtin.copy:
    dest: /etc/systemd/system/cockpit.socket.d/listen.conf
    content: |
      [Socket]
      ListenStream=
      ListenStream=127.0.0.1:9090
    mode: '0644'
  notify: Restart cockpit socket

- name: Deploy cockpit.conf
  ansible.builtin.template:
    src: cockpit.conf.j2
    dest: /etc/cockpit/cockpit.conf
    mode: '0644'
  notify: Restart cockpit socket

- name: Disallow root login to cockpit
  # zetatwo (see the users role) is the admin login now; block root as the
  # package default intends.
  ansible.builtin.copy:
    dest: /etc/cockpit/disallowed-users
    content: |
      root
    mode: '0644'

- name: Enable cockpit socket
  ansible.builtin.systemd:
    name: cockpit.socket
    daemon_reload: true
    enabled: true
    state: started

- name: Deploy caddy site for cockpit
  ansible.builtin.template:
    src: cockpit.caddy.j2
    dest: /etc/caddy/sites/cockpit.caddy
    mode: '0644'
  notify: Reload caddy
