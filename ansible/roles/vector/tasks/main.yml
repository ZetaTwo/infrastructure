---
- name: Create /etc/vector
  ansible.builtin.file:
    path: /etc/vector
    state: directory
    mode: '0755'

- name: Deploy vector.yaml
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: /etc/vector/vector.yaml
    mode: '0644'
  register: vector_config

- name: Deploy ntfy secret env file
  ansible.builtin.template:
    src: ntfy.env.j2
    dest: /etc/vector/ntfy.env
    mode: '0600'
    owner: root
    group: root
  register: vector_env

- name: Deploy vector quadlet
  ansible.builtin.template:
    src: vector.container.j2
    dest: /etc/containers/systemd/vector.container
    mode: '0644'
  register: vector_quadlet

- name: Ensure podman auto-update timer is enabled
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    enabled: true
    state: started

- name: Reload systemd and start vector
  ansible.builtin.systemd:
    name: vector.service
    daemon_reload: true
    state: "{{ 'restarted' if (vector_config.changed or vector_env.changed or vector_quadlet.changed) else 'started' }}"
    enabled: true
