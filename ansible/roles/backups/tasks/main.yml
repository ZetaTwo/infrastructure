---
- name: Ensure backup target namespaces exist
  kubernetes.core.k8s:
    name: "{{ item.namespace }}"
    api_version: v1
    kind: Namespace
    state: present
  loop: "{{ backup_targets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Apply backup secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.name }}-backup-secrets"
        namespace: "{{ item.namespace }}"
      type: Opaque
      # A target with a `postgres:` entry (a database on the shared Postgres,
      # docs/backups.md) also gets libpq's PG* variables, so the CronJob's
      # plain `pg_dump` connects as that database's read-only backup role
      # (ansible/roles/postgres), not the app's own runtime role.
      stringData: >-
        {{ {
          'AWS_ACCESS_KEY_ID': backups_s3_access_key,
          'AWS_SECRET_ACCESS_KEY': backups_s3_secret_key,
          'RESTIC_PASSWORD': item.restic_password,
        } | combine({
          'PGHOST': 'postgres.postgres.svc.cluster.local',
          'PGUSER': item.postgres.user,
          'PGDATABASE': item.postgres.database,
          'PGPASSWORD': item.postgres.password,
        } if item.postgres is defined else {}) }}
  loop: "{{ backup_targets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
