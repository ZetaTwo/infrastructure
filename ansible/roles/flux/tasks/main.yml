---
- name: Download the Flux manifests bundle for {{ flux_version }}
  ansible.builtin.get_url:
    url: "https://github.com/fluxcd/flux2/releases/download/{{ flux_version }}/manifests.tar.gz"
    dest: /etc/rancher/k3s/flux-manifests.tar.gz
    mode: '0644'

- name: Create Flux manifests directory
  ansible.builtin.file:
    path: /etc/rancher/k3s/flux-manifests
    state: directory
    mode: '0755'

- name: Extract Flux manifests bundle
  ansible.builtin.unarchive:
    src: /etc/rancher/k3s/flux-manifests.tar.gz
    dest: /etc/rancher/k3s/flux-manifests
    remote_src: true

- name: Ensure flux-system namespace exists
  kubernetes.core.k8s:
    name: flux-system
    api_version: v1
    kind: Namespace
    state: present

# install.yaml bundles 7 controllers; we only use 4 (docs/cluster-setup.md),
# so install from per-component manifests and skip the rest instead of
# installing then deleting them. These raw files carry no namespace —
# namespace: below fills it in for every object that lacks one.
- name: Install core components for Flux {{ flux_version }}
  kubernetes.core.k8s:
    src: "/etc/rancher/k3s/flux-manifests/{{ item }}"
    namespace: flux-system
    state: present
    apply: true
  loop:
    - rbac.yaml
    - policies.yaml
    - source-controller.yaml
    - kustomize-controller.yaml
    - helm-controller.yaml
    - notification-controller.yaml

- name: Prune unused Flux components (image automation, source-watcher)
  kubernetes.core.k8s:
    src: "/etc/rancher/k3s/flux-manifests/{{ item }}"
    namespace: flux-system
    state: absent
  loop:
    - image-reflector-controller.yaml
    - image-automation-controller.yaml
    - source-watcher.yaml

- name: Wait for Flux controllers to be available
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=Available
    deployment/source-controller deployment/kustomize-controller
    deployment/helm-controller deployment/notification-controller
    -n flux-system --timeout=180s
  changed_when: false

- name: Fetch GitHub SSH host keys
  ansible.builtin.uri:
    url: https://api.github.com/meta
    return_content: true
  register: flux_github_meta

- name: Apply Flux git auth secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: flux-system
        namespace: flux-system
      type: Opaque
      stringData:
        identity: "{{ lookup('file', 'flux-infrastructure-deploy-key') | string }}"
        identity.pub: "{{ lookup('file', 'flux-infrastructure-deploy-key.pub') | string }}"
        known_hosts: "{{ (flux_github_meta.json.ssh_keys | map('regex_replace', '(.+)', 'github.com \\1') | join('\n')) | string }}"
  no_log: true

- name: Apply Flux GitRepository
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'git-repository.yaml.j2') | from_yaml }}"

- name: Apply Flux Kustomization
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'flux-kustomization.yaml.j2') | from_yaml }}"

- name: Wait for the GitRepository to be ready
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=Ready gitrepository/infrastructure
    -n flux-system --timeout=60s
  changed_when: false
