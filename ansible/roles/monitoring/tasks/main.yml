---
- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    name: monitoring
    api_version: v1
    kind: Namespace
    state: present

- name: Apply Alertmanager/Vector Discord webhook secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: alertmanager-discord
        namespace: monitoring
      type: Opaque
      stringData:
        # Plain text, consumed by Alertmanager via discord_configs.webhook_url_file
        # (alertmanager.yaml).
        webhook_url: "{{ alertmanager_discord_webhook_url }}"
        # Same value, JSON-wrapped, consumed by Vector's file secrets
        # backend (vector.yaml) — that backend requires its mounted file
        # to be a JSON object of secret name -> value, unlike Alertmanager's
        # plain-text-file convention, hence the second key instead of
        # reusing webhook_url directly.
        vector-secrets.json: "{{ {'webhook_url': alertmanager_discord_webhook_url} | to_json }}"
  no_log: true

- name: Apply Grafana admin credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-admin-credentials
        namespace: monitoring
      type: Opaque
      stringData:
        admin-user: admin
        admin-password: "{{ grafana_admin_password }}"
  no_log: true

- name: Apply Grafana basic-auth secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-basic-auth
        namespace: monitoring
      type: Opaque
      stringData:
        users: "{{ grafana_basic_auth_htpasswd }}"
  no_log: true
