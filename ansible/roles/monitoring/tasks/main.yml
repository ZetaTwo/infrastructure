---
- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    name: monitoring
    api_version: v1
    kind: Namespace
    state: present

- name: Apply Alertmanager/Vector Discord webhook secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: alertmanager-discord
        namespace: monitoring
      type: Opaque
      stringData:
        # Plain text for Alertmanager (alertmanager.yaml).
        webhook_url: "{{ alertmanager_discord_webhook_url }}"
        # Same value, JSON-wrapped — Vector's file secrets backend
        # (vector.yaml) requires a JSON object, not plain text.
        vector-secrets.json: "{{ {'webhook_url': alertmanager_discord_webhook_url} | to_json }}"
  no_log: true

- name: Apply Grafana admin credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-admin-credentials
        namespace: monitoring
      type: Opaque
      stringData:
        admin-user: admin
        admin-password: "{{ grafana_admin_password }}"
  no_log: true
