  # Each newTag must stay directly under its own `- name:` line.
  - name: ghcr.io/zetatwo/canst-backend
    newTag: main-1793043221-ce29f72df52be4576a18f76a6a97a79941ca1f4f
  - name: ghcr.io/zetatwo/canst-frontend
    newTag: main-1793043221-ce29f72df52be4576a18f76a6a97a79941ca1f4f
