apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canst-staging
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - backup-cronjob.yaml
patches:
  - path: seed-patch.yaml
    target:
      kind: Deployment
      name: canst-backend
images:
