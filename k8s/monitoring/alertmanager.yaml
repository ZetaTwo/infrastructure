# Handles metrics alerts from vmalert; log-based alerts go straight from
# Vector to Discord instead (vector.yaml). Webhook URL is never inlined —
# mounted from a Secret (ansible/roles/monitoring) via webhook_url_file.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  interval: 1h
  chart:
    spec:
      chart: alertmanager
      version: "2.5.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    fullnameOverride: "alertmanager"
    extraSecretMounts:
      - name: discord-webhook
        mountPath: /etc/alertmanager-secrets/discord
        secretName: alertmanager-discord
        readOnly: true
    config:
      global: {}
      route:
        receiver: discord
        group_by: ["alertname"]
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 3h
      receivers:
        - name: discord
          discord_configs:
            - webhook_url_file: /etc/alertmanager-secrets/discord/webhook_url
              title: "🚨 {{ .GroupLabels.alertname }}"
              # Node rules carry `instance` (the node), kubernetes rules
              # `namespace` plus `pod`, `deployment`, `job_name` or `cronjob`.
              # Their kube-state-metrics series have an `instance` too (the
              # scrape target), so `namespace` wins when both are set.
              message: |-
                {{ range .Alerts }}
                {{ if eq .Status "resolved" }}✅ **Resolved:** {{ else }}**Details:** {{ end }}{{ .Annotations.summary }}
                {{ with .Labels.namespace }}**Namespace:** {{ . }}{{ else }}{{ with .Labels.instance }}**Instance:** {{ . }}{{ end }}{{ end }}
                {{ end }}
