# Standalone Alertmanager (not bundled with any other component) — speaks
# the same alerting API vmalert and Loki's ruler both fire to. The Discord
# webhook URL is never inlined in git: it's mounted from a Secret applied
# by the new ansible/roles/monitoring role (not Flux-managed),
# referenced here only as a file path via discord_configs.webhook_url_file.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  interval: 1h
  chart:
    spec:
      chart: alertmanager
      version: "1.43.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    fullnameOverride: "alertmanager"
    extraSecretMounts:
      - name: discord-webhook
        mountPath: /etc/alertmanager-secrets/discord
        secretName: alertmanager-discord
        readOnly: true
    config:
      global: {}
      route:
        receiver: discord
        group_by: ["alertname", "app"]
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 3h
        routes:
          # LogError (loki.yaml) fires once per app per evaluation window
          # for as long as errors keep appearing — renotify much sooner
          # than the 3h default so an ongoing incident isn't silent for
          # hours. The node-resource alerts (vmalert.yaml) have no reason
          # to repeat that fast, so they stay on the parent route above.
          - matchers:
              - alertname = "LogError"
            group_by: ["alertname", "app"]
            group_wait: 10s
            group_interval: 1m
            repeat_interval: 5m
      receivers:
        - name: discord
          discord_configs:
            - webhook_url_file: /etc/alertmanager-secrets/discord/webhook_url
              title: "🚨 {{ .GroupLabels.alertname }}"
              message: |-
                {{ range .Alerts }}
                **App:** {{ .Labels.app }}
                **Details:** {{ .Annotations.summary }}
                {{ end }}
