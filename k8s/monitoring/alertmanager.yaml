# Handles metrics alerts from vmalert; log-based alerts go straight from
# Vector to Discord instead (vector.yaml). Webhook URL is never inlined —
# mounted from a Secret (ansible/roles/monitoring) via webhook_url_file.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  interval: 1h
  chart:
    spec:
      chart: alertmanager
      version: "1.43.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    fullnameOverride: "alertmanager"
    extraSecretMounts:
      - name: discord-webhook
        mountPath: /etc/alertmanager-secrets/discord
        secretName: alertmanager-discord
        readOnly: true
    config:
      global: {}
      route:
        receiver: discord
        group_by: ["alertname"]
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 3h
      receivers:
        - name: discord
          discord_configs:
            - webhook_url_file: /etc/alertmanager-secrets/discord/webhook_url
              title: "🚨 {{ .GroupLabels.alertname }}"
              message: |-
                {{ range .Alerts }}
                **App:** {{ .Labels.app }}
                **Details:** {{ .Annotations.summary }}
                {{ end }}
