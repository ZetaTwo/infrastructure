# Runs as a DaemonSet (role: Agent), tailing every pod's logs on the node,
# scraping node_exporter, and reporting its own internal metrics — per
# MONITORING.md's architecture. Also posts ERROR-level log lines straight
# to Discord (own throttle, bypassing Alertmanager) since that's the only
# place the original log text is ever available — see the transforms
# below. Metrics alerting stays on vmalert → Alertmanager (vmalert.yaml).
#
# customConfig fully replaces the chart's default config (the chart's own
# docs: "if used, **all** options need to be specified") — this is the
# stock "Agent" config the chart would otherwise generate (see the vector
# chart's templates/configmap.yaml), extended with the VRL transform from
# MONITORING.md's vector.yaml snippet and two sinks (Loki, VictoriaMetrics)
# in place of the default's stdout-only sink.
#
# Since the whole customConfig is rendered through Helm's `tpl`, Vector's
# own `{{ field }}` event-templating syntax (used in the Loki sink's
# `labels` below) has to be escaped as {{ "{{ field }}" }} so Helm doesn't
# try to evaluate it itself.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  interval: 1h
  chart:
    spec:
      chart: vector
      version: "0.58.0"
      sourceRef:
        kind: HelmRepository
        name: vector
  values:
    role: Agent
    # Discord posting below needs the same webhook URL Alertmanager uses
    # (alertmanager-discord Secret, applied by ansible/roles/monitoring),
    # kept out of this file via Vector's file secrets backend (the
    # `secret:` block in customConfig) rather than ${VAR} interpolation —
    # Vector 0.57+ disables interpolation by default specifically to stop
    # secrets ending up readable in the process environment
    # (/proc/<pid>/environ), and the file backend is its recommended
    # replacement. The Secret's `vector-secrets.json` key (a JSON object,
    # which this backend requires — unlike Alertmanager's plain-text-file
    # convention) is mounted below and read directly off disk.
    extraVolumes:
      - name: discord-webhook-secret
        secret:
          secretName: alertmanager-discord
    extraVolumeMounts:
      - name: discord-webhook-secret
        mountPath: /etc/vector-secrets
        readOnly: true
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: 0.0.0.0:8686
      # File secrets backend for the Discord webhook URL — resolved once
      # at config load, referenced below as SECRET[discord.webhook_url].
      secret:
        discord:
          type: file
          path: /etc/vector-secrets/vector-secrets.json
      sources:
        kubernetes_logs:
          type: kubernetes_logs
        # CPU/memory/disk metrics come from node_exporter (node-exporter.yaml)
        # rather than Vector's own host_metrics source, so the standard
        # node_exporter-based Grafana dashboards work unmodified (see
        # grafana.yaml) — collecting the same data twice under two
        # different metric names would just waste resources.
        node_exporter:
          type: prometheus_scrape
          endpoints:
            - http://node-exporter.monitoring.svc.cluster.local:9100/metrics
        internal_metrics:
          type: internal_metrics
      transforms:
        # Parses the Rust `tracing` JSON emitted to stdout and promotes
        # `level` to a top-level field so it can become a Loki label.
        parse_app_json:
          type: remap
          inputs: [kubernetes_logs]
          source: |
            parsed_json, err = parse_json(.message)
            if err == null {
              .message = parsed_json
              .level = parsed_json.level
            }
        # Log-based alerting (as opposed to the metrics alerts in
        # vmalert.yaml, which stay on Alertmanager) goes straight from
        # here to Discord — Alertmanager annotations can only template
        # against a query result's labels, never the original log text,
        # so getting the actual error message into the notification means
        # posting it directly from the one place that ever sees it.
        filter_errors:
          type: filter
          inputs: [parse_app_json]
          condition: '.level == "ERROR"'
        # Caps it at one Discord post per app per 30s — without this, a
        # burst of repeated errors from the same app would post one
        # message per line.
        throttle_errors:
          type: throttle
          inputs: [filter_errors]
          threshold: 1
          window_secs: 30
          key_field: '{{ "{{ kubernetes.pod_labels.app }}" }}'
        # Reshapes the event into the exact JSON body Discord's webhook
        # API expects, as a pre-encoded string in .message — the http
        # sink below sends that string as-is (codec: text), rather than
        # wrapping it as one more field inside its own JSON envelope.
        format_discord:
          type: remap
          inputs: [throttle_errors]
          source: |
            app = .kubernetes.pod_labels.app
            if app == null { app = "unknown" }
            text = .message.message
            if text == null { text = encode_json(.message) }
            ts = format_timestamp!(.timestamp, "%Y-%m-%dT%H:%M:%SZ")
            .message = encode_json({
              "embeds": [
                {
                  "title": "An application logged an error",
                  "color": 15158332,
                  "fields": [
                    {"name": "Timestamp", "value": ts, "inline": true},
                    {"name": "App", "value": to_string!(app), "inline": true},
                    {"name": "Message", "value": to_string!(text)}
                  ]
                }
              ]
            })
      sinks:
        loki:
          type: loki
          inputs: [parse_app_json]
          endpoint: http://loki.monitoring.svc.cluster.local:3100
          encoding:
            codec: json
          labels:
            app: '{{ "{{ kubernetes.pod_labels.app }}" }}'
            level: '{{ "{{ level }}" }}'
            namespace: '{{ "{{ kubernetes.pod_namespace }}" }}'
        victoriametrics:
          type: prometheus_remote_write
          inputs: [node_exporter, internal_metrics]
          endpoint: http://vmsingle.monitoring.svc.cluster.local:8428/api/v1/write
        prom_exporter:
          type: prometheus_exporter
          inputs: [node_exporter, internal_metrics]
          address: 0.0.0.0:9090
        discord_errors:
          type: http
          inputs: [format_discord]
          uri: "SECRET[discord.webhook_url]"
          method: post
          encoding:
            codec: text
          framing:
            method: bytes
          batch:
            max_events: 1
          request:
            headers:
              Content-Type: application/json
