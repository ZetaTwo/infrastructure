# DaemonSet (role: Agent): tails pod logs, scrapes node_exporter, reports
# its own metrics. ERROR-level logs also post straight to Discord below,
# bypassing Alertmanager, since that's the only place the raw log text is
# available. Metric alerts stay on vmalert -> Alertmanager (vmalert.yaml).
#
# customConfig replaces the chart's default config entirely (chart docs:
# "if used, all options need to be specified").
#
# Rendered through Helm's `tpl`, so Vector's own `{{ field }}` templating
# (used in the Loki sink's `labels` below) must be escaped as
# {{ "{{ field }}" }} or Helm evaluates it itself.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  interval: 1h
  chart:
    spec:
      chart: vector
      version: "0.58.0"
      sourceRef:
        kind: HelmRepository
        name: vector
  values:
    role: Agent
    # Discord webhook URL (same Secret Alertmanager uses) via Vector's file
    # secrets backend, not ${VAR} interpolation — Vector 0.57+ disables
    # that by default to keep secrets out of /proc/<pid>/environ.
    extraVolumes:
      - name: discord-webhook-secret
        secret:
          secretName: alertmanager-discord
    extraVolumeMounts:
      - name: discord-webhook-secret
        mountPath: /etc/vector-secrets
        readOnly: true
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: 0.0.0.0:8686
      # Resolved once at config load, referenced below as
      # SECRET[discord.webhook_url].
      secret:
        discord:
          type: file
          path: /etc/vector-secrets/vector-secrets.json
      sources:
        kubernetes_logs:
          type: kubernetes_logs
        # node_exporter (node-exporter.yaml), not Vector's own
        # host_metrics, so stock node_exporter Grafana dashboards work
        # unmodified.
        node_exporter:
          type: prometheus_scrape
          endpoints:
            - http://node-exporter.monitoring.svc.cluster.local:9100/metrics
        internal_metrics:
          type: internal_metrics
      transforms:
        # Parses the Rust `tracing` JSON emitted to stdout and promotes
        # `level` to a top-level field so it can become a Loki label.
        parse_app_json:
          type: remap
          inputs: [kubernetes_logs]
          source: |
            parsed_json, err = parse_json(.message)
            if err == null {
              .message = parsed_json
              .level = parsed_json.level
            }
        # Straight to Discord, bypassing Alertmanager — its annotations can
        # only template a query result's labels, never the raw log text.
        filter_errors:
          type: filter
          inputs: [parse_app_json]
          condition: '.level == "ERROR"'
        # One Discord post per app per 30s, so a burst of repeated errors
        # doesn't post one message per line.
        throttle_errors:
          type: throttle
          inputs: [filter_errors]
          threshold: 1
          window_secs: 30
          key_field: '{{ "{{ kubernetes.pod_labels.app }}" }}'
        # Pre-encodes Discord's webhook JSON body as a string; the http
        # sink below sends it as-is (codec: text).
        format_discord:
          type: remap
          inputs: [throttle_errors]
          source: |
            app = .kubernetes.pod_labels.app
            if app == null { app = "unknown" }
            text = .message.message
            if text == null { text = encode_json(.message) }
            ts = format_timestamp!(.timestamp, "%Y-%m-%dT%H:%M:%SZ")
            .message = encode_json({
              "embeds": [
                {
                  "title": "An application logged an error",
                  "color": 15158332,
                  "fields": [
                    {"name": "Timestamp", "value": ts, "inline": true},
                    {"name": "App", "value": to_string!(app), "inline": true},
                    {"name": "Message", "value": to_string!(text)}
                  ]
                }
              ]
            })
      sinks:
        loki:
          type: loki
          inputs: [parse_app_json]
          endpoint: http://loki.monitoring.svc.cluster.local:3100
          encoding:
            codec: json
          labels:
            app: '{{ "{{ kubernetes.pod_labels.app }}" }}'
            level: '{{ "{{ level }}" }}'
            namespace: '{{ "{{ kubernetes.pod_namespace }}" }}'
        victoriametrics:
          type: prometheus_remote_write
          inputs: [node_exporter, internal_metrics]
          endpoint: http://vmsingle.monitoring.svc.cluster.local:8428/api/v1/write
        prom_exporter:
          type: prometheus_exporter
          inputs: [node_exporter, internal_metrics]
          address: 0.0.0.0:9090
        discord_errors:
          type: http
          inputs: [format_discord]
          uri: "SECRET[discord.webhook_url]"
          method: post
          encoding:
            codec: text
          framing:
            method: bytes
          batch:
            max_events: 1
          request:
            headers:
              Content-Type: application/json
