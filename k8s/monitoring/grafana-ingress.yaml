# Hand-written (not the grafana chart's own ingress templating) to match
# k8s/aoe2-groups-proxy/overlays/production/ingress.yaml's style. Access is gated by the
# shared GitHub OAuth ForwardAuth middlewares defined in k8s/auth/ (see
# that directory's middleware.yaml and README.md's "Auth (GitHub OAuth via
# oauth2-proxy)" section) rather than a per-app basic-auth Secret — this was
# the repo's first auth-gated Ingress, originally protected by Traefik
# basicAuth before the cluster-wide auth gate existed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: auth-oauth2-proxy-errors@kubernetescrd,auth-oauth2-proxy-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.zetatwo.dev
      secretName: grafana-tls
  rules:
    - host: grafana.zetatwo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
