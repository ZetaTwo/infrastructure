# Hand-written, not the chart's own ingress templating. Access gated by
# the shared GitHub OAuth ForwardAuth middlewares (k8s/auth/middleware.yaml,
# docs/app-setup.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: auth-oauth2-proxy-errors@kubernetescrd,auth-oauth2-proxy-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.zetatwo.dev
      secretName: grafana-tls
  rules:
    - host: grafana.zetatwo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
