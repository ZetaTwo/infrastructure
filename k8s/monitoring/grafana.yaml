# admin.existingSecret below is break-glass only — normal login goes
# through grafana.ini's [auth.proxy], which trusts the
# X-Auth-Request-User/-Email headers oauth2-proxy-auth (k8s/auth/
# middleware.yaml) sets, logging the user in with their GitHub identity.
# auth.proxy only activates when that header is present; a request
# bypassing Traefik+oauth2-proxy (e.g. kubectl port-forward) falls through
# to the normal login form.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    fullnameOverride: "grafana"
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      auth.proxy:
        enabled: true
        header_name: X-Auth-Request-User
        # GitHub login, not email — oauth2-proxy's GitHub provider never
        # populates PreferredUsername, only User (=login) and Email.
        header_property: username
        auto_sign_up: true
        headers: "Email:X-Auth-Request-Email"
        # Cluster pod CIDR — coarse defense in depth. The real security
        # boundary is Traefik's forwardAuth authResponseHeaders, which
        # always overwrites any client-supplied X-Auth-Request-* header.
        whitelist: 10.42.0.0/16
        enable_login_token: true
      users:
        # Only one GitHub user can ever reach this — give it Admin, not
        # the chart's default Viewer, on auto-provision.
        auto_assign_org_role: Admin
    # Enabled (chart default is off) so dashboards/settings survive a pod
    # restart.
    persistence:
      enabled: true
    # Default init-chown-data runs as root minus CAP_DAC_OVERRIDE, so it
    # can't recursively chown Grafana's own 0700 export dirs after the
    # first run. fsGroup: 472 (chart default) already group-owns the
    # volume at mount time, making this redundant.
    initChownData:
      enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: http://vmsingle.monitoring.svc.cluster.local:8428
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            access: proxy
    # Starter dashboard pulled from grafana.com by ID at startup —
    # "Node Exporter Full", matching the metrics Vector scrapes
    # (node-exporter.yaml).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 37
          datasource: VictoriaMetrics
