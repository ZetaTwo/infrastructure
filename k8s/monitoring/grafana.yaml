# Admin credentials come from a Secret applied by ansible/roles/monitoring
# (not Flux-managed) — see admin.existingSecret below. This is a two-layer
# setup: reachability is gated by the shared GitHub OAuth ForwardAuth
# middlewares in grafana-ingress.yaml (network-level — only an allowlisted
# GitHub identity can reach this Ingress at all), while this admin account
# is Grafana's own separate, in-app login, kept only as a break-glass
# fallback (e.g. if the GitHub OAuth gate is ever misconfigured or down) —
# oauth2-proxy has no way to tell Grafana who authenticated.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    fullnameOverride: "grafana"
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    # Persistence defaults to disabled in this chart (unlike the other
    # components here) — enabled so dashboards/settings survive a pod
    # restart.
    persistence:
      enabled: true
    # The chart's default init-chown-data container runs as root with every
    # capability dropped except CHOWN, so it lacks CAP_DAC_OVERRIDE and
    # can't even traverse into Grafana's own 0700 png/csv/pdf export
    # directories once they exist, failing recursive chown on every pod
    # recreation after the first. The pod's own fsGroup: 472 (chart
    # default) already makes Kubernetes group-own the volume correctly at
    # mount time, making this init container redundant — disabled instead
    # of patching its capabilities.
    initChownData:
      enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: http://vmsingle.monitoring.svc.cluster.local:8428
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            access: proxy
    # Starter dashboard pulled straight from grafana.com by ID at startup
    # (dashboardProviders registers the "default" file-based provider the
    # download lands in) — "Node Exporter Full", built against the
    # node_exporter metrics Vector now scrapes (see node-exporter.yaml).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 37
          datasource: VictoriaMetrics
