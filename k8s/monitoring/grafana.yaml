# Admin credentials come from a Secret applied by ansible/roles/monitoring
# (not Flux-managed) — see admin.existingSecret below. Kept only as a
# break-glass fallback (e.g. if the GitHub OAuth gate is ever
# misconfigured or down) — normal login now goes through grafana.ini's
# [auth.proxy] below, which trusts the X-Auth-Request-User/-Email headers
# the oauth2-proxy-auth Middleware (k8s/auth/middleware.yaml) already sets
# on every authenticated request via authResponseHeaders — so Grafana logs
# the user in directly with their GitHub identity, no separate Grafana
# login screen. auth.proxy only activates when that header is present;
# a request that reaches Grafana without going through Traefik+oauth2-proxy
# (e.g. via kubectl port-forward for break-glass access) falls through to
# the normal login form instead.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    fullnameOverride: "grafana"
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      auth.proxy:
        enabled: true
        header_name: X-Auth-Request-User
        # GitHub login (e.g. "ZetaTwo"), not email — oauth2-proxy's GitHub
        # provider never populates PreferredUsername, only User (=login)
        # and Email, so header_name must be X-Auth-Request-User here.
        header_property: username
        auto_sign_up: true
        # Syncs email from the same forwardAuth response headers.
        headers: "Email:X-Auth-Request-Email"
        # Restricts which source IPs Grafana will trust the header from —
        # defense in depth against a request that reached the Service
        # directly, bypassing Traefik+oauth2-proxy entirely. This is the
        # cluster's pod CIDR (single-node k3s default), so it's coarse —
        # the real security boundary is Traefik's forwardAuth
        # authResponseHeaders, which always overwrites any client-supplied
        # X-Auth-Request-* header with oauth2-proxy's own before forwarding.
        whitelist: 10.42.0.0/16
        enable_login_token: true
      users:
        # The only account that can ever reach this (oauth2-proxy allows
        # just one GitHub user through) — give it Admin, not the chart's
        # default Viewer, on auto-provision.
        auto_assign_org_role: Admin
    # Persistence defaults to disabled in this chart (unlike the other
    # components here) — enabled so dashboards/settings survive a pod
    # restart.
    persistence:
      enabled: true
    # The chart's default init-chown-data container runs as root with every
    # capability dropped except CHOWN, so it lacks CAP_DAC_OVERRIDE and
    # can't even traverse into Grafana's own 0700 png/csv/pdf export
    # directories once they exist, failing recursive chown on every pod
    # recreation after the first. The pod's own fsGroup: 472 (chart
    # default) already makes Kubernetes group-own the volume correctly at
    # mount time, making this init container redundant — disabled instead
    # of patching its capabilities.
    initChownData:
      enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: http://vmsingle.monitoring.svc.cluster.local:8428
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            access: proxy
    # Starter dashboard pulled straight from grafana.com by ID at startup
    # (dashboardProviders registers the "default" file-based provider the
    # download lands in) — "Node Exporter Full", built against the
    # node_exporter metrics Vector now scrapes (see node-exporter.yaml).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 37
          datasource: VictoriaMetrics
