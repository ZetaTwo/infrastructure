# admin.existingSecret below is break-glass only — normal login goes
# through grafana.ini's [auth.proxy], which trusts the
# X-Auth-Request-Email header the oauth2-proxy policy Middleware sets
# (docs/app-setup.md), logging the user in by their Google account email.
# auth.proxy only activates when that header is present; a request
# bypassing Traefik+oauth2-proxy (e.g. kubectl port-forward) falls through
# to the normal login form.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "14.5.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  values:
    fullnameOverride: "grafana"
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      auth.proxy:
        enabled: true
        # Email, not X-Auth-Request-User — with Google that's the opaque
        # numeric account ID.
        header_name: X-Auth-Request-Email
        header_property: email
        auto_sign_up: true
        # Cluster pod CIDR — coarse defense in depth. The real security
        # boundary is Traefik's forwardAuth authResponseHeaders, which
        # always overwrites any client-supplied X-Auth-Request-* header.
        whitelist: 10.42.0.0/16
        enable_login_token: true
      users:
        # Only the oauth2-proxy "admin" policy can reach this — give it
        # Admin, not the chart's default Viewer, on auto-provision.
        auto_assign_org_role: Admin
    # Enabled (chart default is off) so dashboards/settings survive a pod
    # restart.
    persistence:
      enabled: true
    # Default init-chown-data runs as root minus CAP_DAC_OVERRIDE, so it
    # can't recursively chown Grafana's own 0700 export dirs after the
    # first run. fsGroup: 472 (chart default) already group-owns the
    # volume at mount time, making this redundant.
    initChownData:
      enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: http://vmsingle.monitoring.svc.cluster.local:8428
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            access: proxy
    # Starter dashboard pulled from grafana.com by ID at startup —
    # "Node Exporter Full", matching the metrics Vector scrapes
    # (node-exporter.yaml).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 37
          datasource: VictoriaMetrics
        # Every app's RED metrics and feature counters, picked by the
        # namespace/app variables (docs/analytics.md).
        apps:
          json: |
            {
              "title": "Apps",
              "uid": "apps",
              "editable": true,
              "schemaVersion": 39,
              "time": {"from": "now-7d", "to": "now"},
              "templating": {
                "list": [
                  {"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "VictoriaMetrics", "value": "VictoriaMetrics"}, "hide": 2},
                  {"name": "namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(http_requests_total, namespace)", "refresh": 2},
                  {"name": "app", "type": "query", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(http_requests_total{namespace=\"$namespace\"}, app)", "refresh": 2}
                ]
              },
              "panels": [
                {
                  "type": "timeseries", "title": "Requests per second, by route",
                  "gridPos": {"x": 0, "y": 0, "w": 24, "h": 9},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "{{route}}", "expr": "sum by (route) (rate(http_requests_total{namespace=\"$namespace\", app=\"$app\"}[$__rate_interval]))"}]
                },
                {
                  "type": "timeseries", "title": "Share of requests failing (5xx)",
                  "gridPos": {"x": 0, "y": 9, "w": 24, "h": 9},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "5xx", "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", app=\"$app\", status=~\"5..\"}[$__rate_interval])) / sum(rate(http_requests_total{namespace=\"$namespace\", app=\"$app\"}[$__rate_interval]))"}]
                },
                {
                  "type": "timeseries", "title": "p95 latency, by route",
                  "gridPos": {"x": 0, "y": 18, "w": 24, "h": 9},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "{{route}}", "expr": "histogram_quantile(0.95, sum by (route, le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", app=\"$app\"}[$__rate_interval])))"}]
                },
                {
                  "type": "bargauge", "title": "Feature use in the selected range",
                  "gridPos": {"x": 0, "y": 27, "w": 24, "h": 12},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "options": {"orientation": "horizontal", "displayMode": "basic", "showUnfilled": true, "reduceOptions": {"calcs": ["lastNotNull"]}},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "{{feature}}", "instant": true, "expr": "sort_desc(sum by (feature) (round(increase(feature_used_total{namespace=\"$namespace\", app=\"$app\"}[$__range]))))"}]
                },
                {
                  "type": "timeseries", "title": "Feature use per day",
                  "gridPos": {"x": 0, "y": 39, "w": 24, "h": 12},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "custom": {"drawStyle": "bars", "fillOpacity": 80, "stacking": {"mode": "normal"}}}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "{{feature}}", "interval": "1d", "expr": "sum by (feature) (round(increase(feature_used_total{namespace=\"$namespace\", app=\"$app\"}[1d])))"}]
                }
              ]
            }
        # Resource use per app and environment: containers (cAdvisor), requests
        # and limits (kube-state-metrics), and the shared Postgres per database
        # (postgres_exporter). Joins on vmalert's `mappings` rules
        # (docs/monitoring.md#resources).
        resources:
          json: |
            {"title": "Resources", "uid": "resources", "editable": true, "schemaVersion": 39, "time": {"from": "now-24h", "to": "now"}, "templating": {"list": [{"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "VictoriaMetrics", "value": "VictoriaMetrics"}, "hide": 2}, {"name": "env", "label": "Environment", "type": "query", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(namespace:app_env:info, env)", "refresh": 2, "multi": true, "includeAll": true, "allValue": ".*", "current": {"text": "All", "value": "$__all"}}, {"name": "app", "label": "App", "type": "query", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "query_result(sum by (app) (container_memory_working_set_bytes{container!=\"\"} * on (namespace) group_left (app, env) namespace:app_env:info{env=~\"$env\"}))", "regex": "/app=\"([^\"]+)\"/", "refresh": 2, "multi": true, "includeAll": true, "allValue": ".*", "current": {"text": "All", "value": "$__all"}}]}, "panels": [
              {"type": "row", "title": "Usage by app", "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1}, "collapsed": false, "panels": []},
              {"type": "timeseries", "title": "CPU (cores)", "gridPos": {"x": 0, "y": 1, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "none", "min": 0, "custom": {"fillOpacity": 30, "stacking": {"mode": "normal"}}}, "overrides": [{"matcher": {"id": "byName", "options": "node cores"}, "properties": [{"id": "custom.stacking", "value": {"mode": "none"}}, {"id": "custom.fillOpacity", "value": 0}, {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}}, {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}]}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum by (app, env) (rate(container_cpu_usage_seconds_total{container!=\"\"}[$__rate_interval]) * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}"}, {"refId": "B", "expr": "count(node_cpu_seconds_total{mode=\"idle\"})", "legendFormat": "node cores"}]},
              {"type": "timeseries", "title": "Memory (working set)", "gridPos": {"x": 0, "y": 10, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "custom": {"fillOpacity": 30, "stacking": {"mode": "normal"}}}, "overrides": [{"matcher": {"id": "byName", "options": "node memory"}, "properties": [{"id": "custom.stacking", "value": {"mode": "none"}}, {"id": "custom.fillOpacity", "value": 0}, {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}}, {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}, {"matcher": {"id": "byName", "options": "outside pods (k3s, containerd, OS)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "gray"}}]}]}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum by (app, env) (container_memory_working_set_bytes{container!=\"\"} * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}"}, {"refId": "C", "legendFormat": "outside pods (k3s, containerd, OS)", "expr": "sum(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) - sum(container_memory_working_set_bytes{container!=\"\"})"}, {"refId": "B", "expr": "sum(node_memory_MemTotal_bytes)", "legendFormat": "node memory"}], "description": "Working set: what the kernel can't reclaim, and what a memory limit is enforced against. \"Outside pods\" is the node's used memory (total minus available) minus every container: the k3s server, containerd and the OS. With All selected the stack adds up to used memory, and the gap to the dashed line is what's still available."},
              {"type": "timeseries", "title": "Network received", "gridPos": {"x": 0, "y": 19, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "Bps", "min": 0, "custom": {"fillOpacity": 30, "stacking": {"mode": "normal"}}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum by (app, env) ((rate(container_network_receive_bytes_total{interface=\"eth0\"}[$__rate_interval]) unless on (namespace, pod) kube_pod_info{host_network=\"true\"}) * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}"}]},
              {"type": "timeseries", "title": "Network sent", "gridPos": {"x": 0, "y": 28, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "Bps", "min": 0, "custom": {"fillOpacity": 30, "stacking": {"mode": "normal"}}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum by (app, env) ((rate(container_network_transmit_bytes_total{interface=\"eth0\"}[$__rate_interval]) unless on (namespace, pod) kube_pod_info{host_network=\"true\"}) * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}"}]},
              {"type": "row", "title": "Containers", "gridPos": {"x": 0, "y": 37, "w": 24, "h": 1}, "collapsed": false, "panels": []},
              {"type": "table", "title": "Containers: use against requests and limits", "description": "Running containers right now. CPU in cores (5-minute average). An empty limit means none is set.", "gridPos": {"x": 0, "y": 38, "w": 24, "h": 10}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"refId": "cpu", "expr": "sum by (app, env, namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]) * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}", "instant": true, "format": "table"}, {"refId": "cpu_req", "expr": "sum by (app, env, namespace, pod, container) (kube_pod_container_resource_requests{resource=\"cpu\"} * on (namespace, pod) group_left () (kube_pod_status_phase{phase=\"Running\"} == 1) * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}", "instant": true, "format": "table"}, {"refId": "mem", "expr": "sum by (app, env, namespace, pod, container) (container_memory_working_set_bytes{container!=\"\"} * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}", "instant": true, "format": "table"}, {"refId": "mem_req", "expr": "sum by (app, env, namespace, pod, container) (kube_pod_container_resource_requests{resource=\"memory\"} * on (namespace, pod) group_left () (kube_pod_status_phase{phase=\"Running\"} == 1) * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}", "instant": true, "format": "table"}, {"refId": "mem_lim", "expr": "sum by (app, env, namespace, pod, container) (kube_pod_container_resource_limits{resource=\"memory\"} * on (namespace, pod) group_left () (kube_pod_status_phase{phase=\"Running\"} == 1) * on (namespace) group_left (app, env) namespace:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}", "instant": true, "format": "table"}], "transformations": [{"id": "merge", "options": {}}, {"id": "organize", "options": {"excludeByName": {"Time": true}, "indexByName": {"app": 0, "env": 1, "namespace": 2, "pod": 3, "container": 4, "Value #cpu": 5, "Value #cpu_req": 6, "Value #mem": 7, "Value #mem_req": 8, "Value #mem_lim": 9}, "renameByName": {"Value #cpu": "CPU used", "Value #cpu_req": "CPU request", "Value #mem": "Memory used", "Value #mem_req": "Memory request", "Value #mem_lim": "Memory limit"}}}], "fieldConfig": {"defaults": {}, "overrides": [{"matcher": {"id": "byName", "options": "CPU used"}, "properties": [{"id": "unit", "value": "none"}, {"id": "decimals", "value": 2}]}, {"matcher": {"id": "byName", "options": "CPU request"}, "properties": [{"id": "unit", "value": "none"}, {"id": "decimals", "value": 2}]}, {"matcher": {"id": "byName", "options": "Memory used"}, "properties": [{"id": "unit", "value": "bytes"}, {"id": "decimals", "value": 0}]}, {"matcher": {"id": "byName", "options": "Memory request"}, "properties": [{"id": "unit", "value": "bytes"}, {"id": "decimals", "value": 0}]}, {"matcher": {"id": "byName", "options": "Memory limit"}, "properties": [{"id": "unit", "value": "bytes"}, {"id": "decimals", "value": 0}]}]}, "options": {"sortBy": [{"displayName": "Memory used", "desc": true}]}},
