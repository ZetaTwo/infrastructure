              {"type": "row", "title": "Shared Postgres, per database", "gridPos": {"x": 0, "y": 73, "w": 24, "h": 1}, "collapsed": false, "panels": []},
              {"type": "timeseries", "title": "Database size", "gridPos": {"x": 0, "y": 74, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "custom": {"fillOpacity": 30, "stacking": {"mode": "normal"}}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum by (app, env) (pg_database_size_bytes * on (datname) group_left (app, env) datname:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}"}]},
              {"type": "timeseries", "title": "Connections", "gridPos": {"x": 0, "y": 83, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"fillOpacity": 30, "stacking": {"mode": "normal"}}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum by (app, env) (pg_stat_database_numbackends * on (datname) group_left (app, env) datname:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}"}]},
              {"type": "timeseries", "title": "Transactions per second", "gridPos": {"x": 0, "y": 92, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"fillOpacity": 30, "stacking": {"mode": "normal"}}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum by (app, env) ((rate(pg_stat_database_xact_commit[$__rate_interval]) + rate(pg_stat_database_xact_rollback[$__rate_interval])) * on (datname) group_left (app, env) datname:app_env:info{app=~\"$app\", env=~\"$env\"})", "legendFormat": "{{app}} / {{env}}"}]},
              {"type": "timeseries", "title": "Cache hit ratio", "gridPos": {"x": 0, "y": 101, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "custom": {"fillOpacity": 0, "stacking": {"mode": "none"}}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum by (app, env) (rate(pg_stat_database_blks_hit[$__rate_interval]) * on (datname) group_left (app, env) datname:app_env:info{app=~\"$app\", env=~\"$env\"}) / (sum by (app, env) (rate(pg_stat_database_blks_hit[$__rate_interval]) * on (datname) group_left (app, env) datname:app_env:info{app=~\"$app\", env=~\"$env\"}) + sum by (app, env) (rate(pg_stat_database_blks_read[$__rate_interval]) * on (datname) group_left (app, env) datname:app_env:info{app=~\"$app\", env=~\"$env\"}))", "legendFormat": "{{app}} / {{env}}"}], "description": "Share of block reads served from Postgres's buffer cache. Gaps mean the database read nothing."},
              {"type": "timeseries", "title": "Postgres server CPU (cores, all databases)", "gridPos": {"x": 0, "y": 110, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "none", "min": 0, "custom": {"fillOpacity": 0, "stacking": {"mode": "none"}}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"postgres\", container=\"postgres\"}[$__rate_interval]))", "legendFormat": "postgres"}], "description": "One shared server: CPU and memory can't be split per database."},
              {"type": "timeseries", "title": "Postgres server memory (all databases)", "gridPos": {"x": 0, "y": 119, "w": 24, "h": 9}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "custom": {"fillOpacity": 0, "stacking": {"mode": "none"}}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"refId": "A", "expr": "sum(container_memory_working_set_bytes{namespace=\"postgres\", container=\"postgres\"})", "legendFormat": "postgres"}], "description": "One shared server: CPU and memory can't be split per database."}
            ]}
