# admin.existingSecret below is break-glass only — normal login goes
# through grafana.ini's [auth.proxy], which trusts the
# X-Auth-Request-Email header the oauth2-proxy policy Middleware sets
# (docs/app-setup.md), logging the user in by their Google account email.
# auth.proxy only activates when that header is present; a request
# bypassing Traefik+oauth2-proxy (e.g. kubectl port-forward) falls through
# to the normal login form.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    fullnameOverride: "grafana"
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      auth.proxy:
        enabled: true
        # Email, not X-Auth-Request-User — with Google that's the opaque
        # numeric account ID.
        header_name: X-Auth-Request-Email
        header_property: email
        auto_sign_up: true
        # Cluster pod CIDR — coarse defense in depth. The real security
        # boundary is Traefik's forwardAuth authResponseHeaders, which
        # always overwrites any client-supplied X-Auth-Request-* header.
        whitelist: 10.42.0.0/16
        enable_login_token: true
      users:
        # Only the oauth2-proxy "admin" policy can reach this — give it
        # Admin, not the chart's default Viewer, on auto-provision.
        auto_assign_org_role: Admin
    # Enabled (chart default is off) so dashboards/settings survive a pod
    # restart.
    persistence:
      enabled: true
    # Default init-chown-data runs as root minus CAP_DAC_OVERRIDE, so it
    # can't recursively chown Grafana's own 0700 export dirs after the
    # first run. fsGroup: 472 (chart default) already group-owns the
    # volume at mount time, making this redundant.
    initChownData:
      enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: http://vmsingle.monitoring.svc.cluster.local:8428
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            access: proxy
    # Starter dashboard pulled from grafana.com by ID at startup —
    # "Node Exporter Full", matching the metrics Vector scrapes
    # (node-exporter.yaml).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 37
          datasource: VictoriaMetrics
        # Every app's RED metrics and feature counters, picked by the
        # namespace/app variables (docs/analytics.md).
        apps:
          json: |
            {
              "title": "Apps",
              "uid": "apps",
              "editable": true,
              "schemaVersion": 39,
              "time": {"from": "now-7d", "to": "now"},
              "templating": {
                "list": [
                  {"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "VictoriaMetrics", "value": "VictoriaMetrics"}, "hide": 2},
                  {"name": "namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(http_requests_total, namespace)", "refresh": 2},
                  {"name": "app", "type": "query", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(http_requests_total{namespace=\"$namespace\"}, app)", "refresh": 2}
                ]
              },
              "panels": [
                {
                  "type": "timeseries", "title": "Requests per second, by route",
                  "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "{{route}}", "expr": "sum by (route) (rate(http_requests_total{namespace=\"$namespace\", app=\"$app\"}[$__rate_interval]))"}]
                },
                {
                  "type": "timeseries", "title": "Share of requests failing (5xx)",
                  "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "5xx", "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", app=\"$app\", status=~\"5..\"}[$__rate_interval])) / sum(rate(http_requests_total{namespace=\"$namespace\", app=\"$app\"}[$__rate_interval]))"}]
                },
                {
                  "type": "timeseries", "title": "p95 latency, by route",
                  "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "{{route}}", "expr": "histogram_quantile(0.95, sum by (route, le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", app=\"$app\"}[$__rate_interval])))"}]
                },
                {
                  "type": "bargauge", "title": "Feature use in the selected range",
                  "gridPos": {"x": 0, "y": 16, "w": 10, "h": 12},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "options": {"orientation": "horizontal", "displayMode": "basic", "showUnfilled": true, "reduceOptions": {"calcs": ["lastNotNull"]}},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "{{feature}}", "instant": true, "expr": "sort_desc(sum by (feature) (round(increase(feature_used_total{namespace=\"$namespace\", app=\"$app\"}[$__range]))))"}]
                },
                {
                  "type": "timeseries", "title": "Feature use per day",
                  "gridPos": {"x": 10, "y": 16, "w": 14, "h": 12},
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "custom": {"drawStyle": "bars", "fillOpacity": 80, "stacking": {"mode": "normal"}}}, "overrides": []},
                  "targets": [{"refId": "A", "legendFormat": "{{feature}}", "interval": "1d", "expr": "sum by (feature) (round(increase(feature_used_total{namespace=\"$namespace\", app=\"$app\"}[1d])))"}]
                }
              ]
            }
