# Single-binary Loki (no S3/object storage, no separate read/write/backend
# components) — matches the single-node, resource-conscious scope of
# MONITORING.md. Storage is a local PVC on k3s's default "local-path"
# StorageClass. Vector pushes logs here (vector.yaml sink) and Grafana
# queries it. Log-based alerting (ERROR-level lines) is handled directly
# by Vector posting to Discord (vector.yaml), not by Loki's ruler — see
# that file's comment for why — so the ruler is unused here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # Fixes the Service name to "loki" (reachable at
    # loki.monitoring.svc.cluster.local:3100) instead of a chart-generated
    # name.
    fullnameOverride: "loki"
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
    # No other deployment mode's components are used.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    # The chart enables two memcached-backed caches by default
    # (chunksCache wants 8Gi, resultsCache 1Gi) — both oversized for a
    # single small-VPS node and unnecessary for this scale; disabling them
    # is what let the singleBinary pod actually get scheduled.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      useTestSchema: true
    gateway:
      enabled: false
    test:
      enabled: false
    lokiCanary:
      enabled: false
    monitoring:
      selfMonitoring:
        enabled: false
      lokiCanary:
        enabled: false
      serviceMonitor:
        enabled: false
