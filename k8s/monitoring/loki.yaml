# Single-binary Loki (no S3/object storage, no separate read/write/backend
# components) — matches the single-node, resource-conscious scope of
# MONITORING.md. Storage is a local PVC on k3s's default "local-path"
# StorageClass. Vector pushes logs here (loki.yaml sink); Grafana queries
# it; its own ruler evaluates log-based alert rules and fires them to
# Alertmanager, same as vmalert does for metrics.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # Fixes the Service name to "loki" (reachable at
    # loki.monitoring.svc.cluster.local:3100) instead of a chart-generated
    # name.
    fullnameOverride: "loki"
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
    # No other deployment mode's components are used.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    # The chart enables two memcached-backed caches by default
    # (chunksCache wants 8Gi, resultsCache 1Gi) — both oversized for a
    # single small-VPS node and unnecessary for this scale; disabling them
    # is what let the singleBinary pod actually get scheduled.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      useTestSchema: true
      # Points the ruler at Alertmanager so log-based alert rules (added
      # later, none defined yet) fire the same way vmalert's metrics rules
      # do. The chart's default sidecar (sidecar.rules, enabled by
      # default) picks up rule files from ConfigMaps labeled "loki_rule"
      # and drops them into sidecar.rules.folder (default /rules), which
      # must match rulerConfig.storage.local.directory below — see the
      # chart's values.yaml for how to add one.
      rulerConfig:
        alertmanager_url: http://alertmanager.monitoring.svc.cluster.local:9093
        storage:
          type: local
          local:
            directory: /rules
    sidecar:
      rules:
        # Single-tenant Loki (auth_enabled: false) reads rules from
        # /rules/fake — the sidecar only writes into a per-tenant
        # subdirectory via this per-ConfigMap annotation, set on the rules
        # ConfigMap below.
        folderAnnotation: loki_rule_folder
    gateway:
      enabled: false
    test:
      enabled: false
    lokiCanary:
      enabled: false
    monitoring:
      selfMonitoring:
        enabled: false
      lokiCanary:
        enabled: false
      serviceMonitor:
        enabled: false
    # Picked up by the sidecar above and dropped into /rules/fake, per the
    # loki_rule_folder annotation. `sum by (app)` gives each erroring app
    # its own alert identity, so two apps erroring independently fire (and
    # resolve) as two separate alerts.
    #
    # extraObjects is rendered through Helm's `tpl` (like customConfig in
    # vector.yaml), so the ruler's own {{ $labels.app }} annotation syntax
    # has to be escaped as {{ "{{ $labels.app }}" }} below so Helm doesn't
    # try to evaluate it itself.
    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: loki-rules-app-errors
          labels:
            loki_rule: "true"
          annotations:
            loki_rule_folder: /rules/fake
        data:
          app-errors.yaml: |
            groups:
              - name: app-errors
                rules:
                  - alert: LogError
                    expr: sum by (app) (count_over_time({level="ERROR"}[1m])) > 0
                    for: 0m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{ "{{ $labels.app }}" }} logged an ERROR'
