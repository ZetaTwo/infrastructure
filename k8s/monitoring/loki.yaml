# Single-binary Loki, local-path PVC storage. Vector pushes logs here,
# Grafana queries it. Log-based alerting goes via Vector -> Discord
# (vector.yaml), not Loki's ruler, so the ruler is unused.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # Service name "loki" (loki.monitoring.svc.cluster.local:3100).
    fullnameOverride: "loki"
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
    # Other deployment-mode components unused.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    # Default memcached caches (chunksCache 8Gi, resultsCache 1Gi) are
    # oversized for this node — disabling let the pod get scheduled.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      useTestSchema: true
    gateway:
      enabled: false
    test:
      enabled: false
    lokiCanary:
      enabled: false
    monitoring:
      selfMonitoring:
        enabled: false
      lokiCanary:
        enabled: false
      serviceMonitor:
        enabled: false
