# Standard node_exporter DaemonSet — replaces Vector's own host_metrics
# source (removed from vector.yaml) as the source of CPU/memory/disk
# metrics, specifically so the well-known community dashboards (e.g.
# grafana.com dashboard 1860 "Node Exporter Full", see grafana.yaml) work
# against real `node_*`-named metrics instead of Vector's differently
# named `host_*` ones. Vector scrapes this and forwards to VictoriaMetrics
# (see vector.yaml's node_exporter source) rather than adding a separate
# scraper (vmagent) just for this one target.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.57.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # Fixes the Service name to "node-exporter" (reachable at
    # node-exporter.monitoring.svc.cluster.local:9100) instead of a
    # chart-generated name.
    fullnameOverride: "node-exporter"
