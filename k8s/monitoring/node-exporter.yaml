# Standard node_exporter DaemonSet, not Vector's host_metrics, so the
# community dashboards (grafana.yaml) work against real `node_*` metrics.
# Vector scrapes and forwards this (vector.yaml) instead of adding vmagent.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.57.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # Service name "node-exporter" (node-exporter.monitoring.svc.cluster.local:9100).
    fullnameOverride: "node-exporter"
