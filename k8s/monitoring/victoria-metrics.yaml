# Single-node metrics storage. Vector remote-writes here; Grafana and
# vmalert read via its Prometheus-compatible HTTP API.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  values:
    server:
      # Service name "vmsingle" (vmsingle.monitoring.svc.cluster.local:8428).
      fullnameOverride: "vmsingle"
