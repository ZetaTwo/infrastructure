# Single-node metrics storage and the only metrics scraper: the infra
# exporters, Vector's own metrics and annotated app pods (scrape below).
# Grafana and vmalert read via its Prometheus-compatible HTTP API.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.51.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  values:
    server:
      # Service name "vmsingle" (vmsingle.monitoring.svc.cluster.local:8428).
      fullnameOverride: "vmsingle"
      # Months. Long enough for feature-usage trends; ~1.4 GB per month at
      # today's series count, so ~17 GB on the node disk (HighDiskUsage).
      retentionPeriod: 12
      # Re-reads the scrape config below when it changes; otherwise only a
      # restart or SIGHUP picks up an edit.
      extraArgs:
        promscrape.configCheckInterval: 1m
      scrape:
        enabled: true
        # Replaces the chart's default jobs (apiserver, nodes, cadvisor, ...).
        # The infra jobs find their pods by chart label and port name, one
        # target per pod, so they follow DaemonSets onto new nodes.
        config:
          global:
            scrape_interval: 30s
          scrape_configs:
            - job_name: node-exporter
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [monitoring]
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: prometheus-node-exporter;metrics
                # The node's name, not the host IP:port (shown in alerts).
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: instance
            - job_name: kube-state-metrics
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [monitoring]
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: kube-state-metrics;http
            # Vector's internal metrics, from its prometheus_exporter sink.
            - job_name: vector
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [monitoring]
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: vector;prom-exporter
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: instance
            # Per-container CPU, memory and network from each node's kubelet
            # (cAdvisor), for the Resources dashboard. The chart's RBAC grants
            # nodes/metrics. k3s signs the kubelet's serving cert (node IPs
            # included) with the same CA as the service-account bundle.
            - job_name: cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
              # cAdvisor exposes ~100 metric names per container; keep only
              # what the dashboard reads.
              metric_relabel_configs:
                - action: keep
                  source_labels: [__name__]
                  regex: container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total|oom_events_total)
            # App pods that opt in with prometheus.io/scrape + prometheus.io/port,
            # where the port must also be a declared containerPort.
            - job_name: kubernetes-pods
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - action: drop
                  source_labels: [__meta_kubernetes_pod_container_init]
                  regex: true
                - action: keep_if_equal
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
                - action: keep
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: true
                # Infra charts annotate their pods too (~3,800 series that
                # nothing reads); only apps are wanted.
                - action: drop
                  source_labels: [__meta_kubernetes_namespace]
                  regex: cert-manager|flux-system|kube-system
                # Same `app` and `namespace` labels as the logs in Loki.
                - source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: app
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
