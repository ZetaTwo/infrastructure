# Single-node metrics storage. Vector remote-writes here; Grafana and
# vmalert read via its Prometheus-compatible HTTP API. It also scrapes app
# pods itself (scrape below): Vector's prometheus_scrape only takes static
# endpoints, while vmsingle can discover pods (docs/analytics.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  values:
    server:
      # Service name "vmsingle" (vmsingle.monitoring.svc.cluster.local:8428).
      fullnameOverride: "vmsingle"
      # Months. Long enough for feature-usage trends; ~1.4 GB per month at
      # today's series count, so ~17 GB on the node disk (HighDiskUsage).
      retentionPeriod: 12
      # Re-reads the scrape config below when it changes; otherwise only a
      # restart or SIGHUP picks up an edit.
      extraArgs:
        promscrape.configCheckInterval: 1m
      scrape:
        enabled: true
        # Replaces the chart's default jobs (apiserver, nodes, cadvisor, ...):
        # only pods that opt in with prometheus.io/scrape + prometheus.io/port,
        # where the port must also be a declared containerPort.
        config:
          global:
            scrape_interval: 30s
          scrape_configs:
            - job_name: kubernetes-pods
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - action: drop
                  source_labels: [__meta_kubernetes_pod_container_init]
                  regex: true
                - action: keep_if_equal
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
                - action: keep
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: true
                # Infra charts annotate their pods too (~3,800 series that
                # nothing reads); only apps are wanted.
                - action: drop
                  source_labels: [__meta_kubernetes_namespace]
                  regex: cert-manager|flux-system|kube-system
                # Same `app` and `namespace` labels as the logs in Loki.
                - source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: app
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
