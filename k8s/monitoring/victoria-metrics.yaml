# Single-node metrics storage — matches this being a single-node cluster.
# Vector remote-writes host/internal metrics here; Grafana and vmalert both
# read from it via its Prometheus-compatible HTTP API.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  values:
    server:
      # Fixes the Service name to "vmsingle" (reachable at
      # vmsingle.monitoring.svc.cluster.local:8428) instead of a
      # chart-generated name, so other components can address it by a
      # stable, predictable DNS name.
      fullnameOverride: "vmsingle"
