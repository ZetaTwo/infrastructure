# Caddy serving the built SPA only; the Ingress routes /api to aoe2tm-backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoe2tm-frontend
  labels:
    app: aoe2tm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aoe2tm-frontend
  template:
    metadata:
      labels:
        app: aoe2tm-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: aoe2tm-frontend
          # Always overridden by each overlay's images: newTag:.
          image: ghcr.io/zetatwo/aoe2tm-frontend:placeholder-overridden-by-overlay
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
