apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aoe2tm-production
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - backup-cronjob.yaml
images:
  # Set by the deploy workflow to the newest release tags (deploy-targets.toml).
  # Each newTag must stay directly under its own `- name:` line. v0.0.0 is a
  # placeholder until the app's first vX.Y.Z release.
  - name: ghcr.io/zetatwo/aoe2tm-backend
    newTag: v0.0.0
  - name: ghcr.io/zetatwo/aoe2tm-frontend
    newTag: v0.0.0
