# Public, like production (no oauth2-proxy gate), so alpha testers can reach it:
# the app's closed beta keeps everyone without an invite code out, and seed
# users can't log in (no password, no linked identity). A single Ingress: /api
# to the backend (including the login providers' callbacks and Twitch's
# webhook), everything else to the SPA, on one host so aoe2tm's auth cookies
# stay same-site with no CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoe2tm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gatherpoint.zetatwo.dev
      secretName: aoe2tm-staging-tls
  rules:
    - host: gatherpoint.zetatwo.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aoe2tm-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aoe2tm-frontend
                port:
                  number: 80
