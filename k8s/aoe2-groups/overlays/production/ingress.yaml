# Public, so no auth middleware and a single Ingress: /api to the backend,
# everything else to the frontend (longest path wins).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoe2-groups
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - aoe2-groups.zeta-two.com
      secretName: aoe2-groups-tls
  rules:
    - host: aoe2-groups.zeta-two.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aoe2-groups-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aoe2-groups-frontend
                port:
                  number: 80
