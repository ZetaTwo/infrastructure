apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoe2-groups-backend
  labels:
    app: aoe2-groups-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aoe2-groups-backend
  template:
    metadata:
      labels:
        app: aoe2-groups-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: aoe2-groups-backend
          # Always overridden by each overlay's images: newTag:.
          image: ghcr.io/zetatwo/aoe2-groups-backend:placeholder-overridden-by-overlay
          ports:
            - containerPort: 8080
          env:
            - name: RUST_LOG
              value: info
            - name: TOURNAMENTS_PATH
              value: /etc/aoe2-groups/config/tournaments.toml
            - name: SHEET_IDS_PATH
              value: /etc/aoe2-groups/secrets/sheet-ids.toml
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/aoe2-groups/secrets/service-account.json
          volumeMounts:
            - name: config
              mountPath: /etc/aoe2-groups/config
              readOnly: true
            - name: secrets
              mountPath: /etc/aoe2-groups/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
      volumes:
        # Generated by kustomization.yaml's configMapGenerator; its name gets
        # a content hash, so editing tournaments.toml rolls this Deployment.
        - name: config
          configMap:
            name: aoe2-groups-tournaments
        # Rendered by ansible/roles/aoe2_groups.
        - name: secrets
          secret:
            secretName: aoe2-groups-secrets
