apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
# The tournament list, shared by staging and production. The generated name
# carries a content hash, so a change here restarts the backend with it.
configMapGenerator:
  - name: aoe2-groups-tournaments
    files:
      - tournaments.toml
