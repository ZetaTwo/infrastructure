# Tournament routing for aoe2-groups-backend, mounted from a ConfigMap
# (kustomize configMapGenerator, so editing this file rolls the pods).
#
# - slug          the tournament's URL segment: /<slug>/<bracket>.
# - name          display name on the index pages.
# - brackets[]    matches a sheet tab; group_ranges are the A1 ranges within
#                 that tab — one entry per group. Order determines Group A,
#                 Group B, … Bracket names must be unique per tournament, and
#                 "all" is reserved (the /<slug>/all overlay).
#
# Tournaments are listed on the index page in this order, so add new ones
# at the top. Each one with brackets also needs a slug = "<sheet_id>" line
# in the vaulted sheet-ids.toml (ansible/roles/aoe2_groups/files/), and the
# sheet must be shared with the runtime service account as Viewer.

[[tournaments]]
slug = "royal-tcc"
name = "Royal TCC"

[[tournaments.brackets]]
name = "Emperor"
group_ranges = ["G4:P9", "V4:AE9"]

