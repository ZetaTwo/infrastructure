apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aoe2-groups-proxy
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
images:
  # CI's deploy-production job (aoe2-streaming's backend-deploy.yml)
  # rewrites this line only when a GitHub Release is published, promoting
  # the exact image already tested in staging (retagged, not rebuilt).
  # Keep it as the only `newTag:` occurrence in this file.
  - name: ghcr.io/zetatwo/aoe2-groups-proxy
    newTag: v1
