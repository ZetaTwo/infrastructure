# Strategic-merge patch overriding just ALLOWED_ORIGINS. Adds a local
# frontend dev server alongside production's origin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoe2-groups-proxy
spec:
  template:
    spec:
      containers:
        - name: aoe2-groups-proxy
          env:
            - name: ALLOWED_ORIGINS
              value: "https://aoe2streaming.zeta-two.com,http://localhost:5173"
