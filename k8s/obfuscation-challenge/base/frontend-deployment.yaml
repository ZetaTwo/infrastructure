# Caddy serving the built SPA only; the Ingress routes /api to the backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obfuscation-challenge-frontend
  labels:
    app: obfuscation-challenge-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obfuscation-challenge-frontend
  template:
    metadata:
      labels:
        app: obfuscation-challenge-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      containers:
        - name: obfuscation-challenge-frontend
          # Always overridden by each overlay's images: newTag:.
          image: ghcr.io/zetatwo/obfuscation-challenge-frontend:placeholder-overridden-by-overlay
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
