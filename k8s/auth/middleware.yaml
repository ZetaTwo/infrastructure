# Reusable Traefik ForwardAuth gate — any Ingress in any namespace opts in
# via:
#   traefik.ingress.kubernetes.io/router.middlewares: auth-oauth2-proxy-errors@kubernetescrd,auth-oauth2-proxy-auth@kubernetescrd
# See k8s/monitoring/grafana-ingress.yaml for the reference usage and
# README.md's "Auth (GitHub OAuth via oauth2-proxy)" section.
#
# Two middlewares are needed together: forwardAuth alone only relays
# whatever status code oauth2-proxy's /oauth2/auth returns (401 for
# unauthenticated) — it doesn't turn that into a login redirect. The errors
# middleware is oauth2-proxy's own documented Traefik recipe for rewriting
# that 401 into a 302 to its sign-in page.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Access-Token
      - Authorization
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-errors
spec:
  errors:
    status:
      - "401-403"
    service:
      name: oauth2-proxy
      port: 4180
    # /oauth2/start (not /oauth2/sign_in) deliberately: oauth2-proxy's
    # sign_in page template uses host-relative links/form actions
    # (e.g. action="/oauth2/start"), which break when this middleware
    # serves that page's content in place of the original host's response —
    # the browser stays on the protected app's origin (e.g.
    # grafana.zetatwo.dev), so those relative links resolve against the
    # wrong host and go nowhere. /oauth2/start instead returns a genuine
    # 302 with an absolute Location straight to GitHub's OAuth authorize
    # endpoint, which has no such problem and skips the extra click.
    query: /oauth2/start?rd={url}
    # Without this, Traefik forwards oauth2-proxy's sign-in page body but
    # keeps the original 401/403 status, so browsers show it as an error
    # page instead of following it as a redirect.
    statusRewrites:
      "401": 302
      "403": 302
