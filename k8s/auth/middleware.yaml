# Reusable Traefik ForwardAuth gate — any Ingress opts in via (errors
# before auth — order matters, forwardAuth short-circuits the chain):
#   traefik.ingress.kubernetes.io/router.middlewares: auth-oauth2-proxy-errors@kubernetescrd,auth-oauth2-proxy-auth@kubernetescrd
# Reference usage: k8s/monitoring/grafana-ingress.yaml, docs/app-setup.md.
#
# forwardAuth alone only relays oauth2-proxy's 401 — it doesn't redirect.
# errors rewrites that into a redirect (oauth2-proxy's documented recipe).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Access-Token
      - Authorization
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-errors
spec:
  errors:
    status:
      - "401-403"
    service:
      name: oauth2-proxy
      port: 4180
    # /oauth2/start, not /oauth2/sign_in: sign_in's links are host-relative
    # and break when served in place on the protected app's origin.
    # /oauth2/start instead returns a genuine absolute redirect to GitHub.
    query: /oauth2/start?rd={url}
    # Without this, the response keeps its original 401/403 status, so
    # browsers show an error page instead of following the redirect.
    statusRewrites:
      "401": 302
      "403": 302
