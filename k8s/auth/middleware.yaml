# First half of the auth chain on a gated Ingress; the second half is a
# per-policy forwardAuth Middleware applied by Ansible
# (ansible/roles/oauth2_proxy/templates/middlewares.yaml.j2):
#   traefik.ingress.kubernetes.io/router.middlewares: auth-oauth2-proxy-errors@kubernetescrd,auth-oauth2-proxy-auth-<policy>@kubernetescrd
#
# forwardAuth alone only relays oauth2-proxy's 401 — it doesn't redirect.
# errors rewrites that into a redirect (oauth2-proxy's documented recipe).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-errors
spec:
  errors:
    # 401 only: a 403 means signed in but not on this app's policy, and
    # redirecting that back to sign-in would loop forever.
    status:
      - "401"
    service:
      name: oauth2-proxy
      port: 4180
    # /oauth2/start, not /oauth2/sign_in: sign_in's links are host-relative
    # and break when served in place on the protected app's origin.
    # /oauth2/start instead returns a genuine absolute redirect to Google.
    query: /oauth2/start?rd={url}
    # Without this, the response keeps its original 401 status, so
    # browsers show an error page instead of following the redirect.
    statusRewrites:
      "401": 302
