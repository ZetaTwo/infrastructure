# No forwardAuth middleware attached here — oauth2-proxy's own
# sign-in/callback endpoints must stay directly reachable, or protecting
# this Ingress with itself would create a redirect loop.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.zetatwo.dev
      secretName: auth-tls
  rules:
    - host: auth.zetatwo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
