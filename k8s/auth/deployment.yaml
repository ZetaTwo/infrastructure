# Pure Traefik ForwardAuth target (middleware.yaml) — no real upstream
# backend (--upstream=static://202). --github-user is plaintext, not
# vaulted: nothing under k8s/ is templated by Ansible.
#
# Image tag pinned — releases: https://github.com/oauth2-proxy/oauth2-proxy/releases
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          args:
            - --provider=github
            # Comma-separated GitHub usernames allowed through the gate.
            - --github-user=ZetaTwo
            # Required or logins get rejected post-handshake — see
            # https://oauth2-proxy.github.io/oauth2-proxy/configuration/providers/github
            - --email-domain=*
            # No --scope override: default "user:email read:org" is
            # required even without --github-org/--github-team — the
            # GitHub provider unconditionally calls /user/orgs during
            # session creation. Narrowing to user:email breaks login with
            # a 500. Tracked upstream: oauth2-proxy/oauth2-proxy#3482
            - --redirect-url=https://auth.zetatwo.dev/oauth2/callback
            # .zetatwo.dev, not just auth.zetatwo.dev, so the cookie is
            # reusable by future apps on the same domain.
            - --cookie-domain=.zetatwo.dev
            - --whitelist-domain=.zetatwo.dev
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --cookie-secure=true
          envFrom:
            - secretRef:
                name: oauth2-proxy-secrets
          ports:
            - containerPort: 4180
