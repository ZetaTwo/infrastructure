# Pure Traefik ForwardAuth target — no real upstream backend
# (--upstream=static://202). Google login; who may sign in comes from the
# oauth2-proxy-emails Secret, and per-app policy Middlewares narrow that
# further (both applied by ansible/roles/oauth2_proxy, emails vaulted).
#
# Image tag pinned — releases: https://github.com/oauth2-proxy/oauth2-proxy/releases
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          args:
            - --provider=google
            # No --email-domain: setting it (even to *) would let any
            # Google account in alongside this list.
            - --authenticated-emails-file=/etc/oauth2-proxy/emails/authenticated-emails.txt
            - --redirect-url=https://auth.zetatwo.dev/oauth2/callback
            # .zetatwo.dev, not just auth.zetatwo.dev, so the cookie is
            # reusable by future apps on the same domain.
            - --cookie-domain=.zetatwo.dev
            - --whitelist-domain=.zetatwo.dev
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --cookie-secure=true
          envFrom:
            - secretRef:
                name: oauth2-proxy-secrets
          volumeMounts:
            - name: emails
              mountPath: /etc/oauth2-proxy/emails
              readOnly: true
          ports:
            - containerPort: 4180
      volumes:
        - name: emails
          secret:
            secretName: oauth2-proxy-emails
