apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoe2-tournament-bot
  labels:
    app: aoe2-tournament-bot
spec:
  # Single persistent Discord gateway WebSocket — never autoscaled, no
  # Service/Ingress.
  replicas: 1
  selector:
    matchLabels:
      app: aoe2-tournament-bot
  template:
    metadata:
      labels:
        app: aoe2-tournament-bot
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: aoe2-tournament-bot
          # CI rewrites this on release only (docs/app-setup.md).
          image: ghcr.io/zetatwo/aoe2-tournament-bot:v1
          env:
            - name: RUST_LOG
              value: "info,serenity=warn"
            - name: CONFIG_PATH
              value: /etc/aoe2-tournament-bot/config.toml
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/aoe2-tournament-bot/service-account.json
          volumeMounts:
            - name: aoe2-tournament-bot-secrets
              mountPath: /etc/aoe2-tournament-bot
              readOnly: true
      volumes:
        - name: aoe2-tournament-bot-secrets
          secret:
            secretName: aoe2-tournament-bot-secrets
