# Pins deploy-targets.toml's targets to their newest ghcr.io tags and
# commits any change; Flux then rolls it out. Triggered by app repos via
# .github/actions/trigger-deploy (or by hand). Every run recomputes all
# targets, so GitHub coalescing queued runs in the concurrency group loses
# nothing.
name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  # Each ghcr package must grant this repo read access (docs/app-setup.md).
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve image tags
        id: resolve
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_CHANGES_FILE: ${{ runner.temp }}/changes.txt
        run: python3 .github/scripts/resolve-deploy-tags.py

      # !cancelled(): still ship the targets that resolved even if another
      # one failed (the job still ends red).
      - name: Commit and push
        if: ${{ !cancelled() }}
        env:
          CHANGES_FILE: ${{ runner.temp }}/changes.txt
        run: |
          if git diff --quiet; then
            echo "Nothing to deploy"
            echo "Nothing to deploy: every target is already at its resolved tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: deploy $(paste -sd ';' "$CHANGES_FILE" | sed 's/;/; /g')" \
            -m "$(cat "$CHANGES_FILE")"
          # Only races with human pushes, which never touch these lines.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              sha=$(git rev-parse HEAD)
              echo "Pushed [\`${sha:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}) to \`main\`; Flux rolls it out within about a minute." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "❌ Push to \`main\` failed after 5 attempts." >> "$GITHUB_STEP_SUMMARY"
          exit 1
